<script>const LESSONS = [
{id:'basics',group:'기초 다지기',title:'생명체를 만드는 네 가지 물질',time:12,pages:'8–19',pdf:'5–10',lead:'구조를 알면 기능이 따라온다. 탄수화물·지질·단백질·핵산을 먼저 구별하자.',keys:['단당류','인지질','아미노산','뉴클레오타이드'],cards:[['탄수화물: 연료이자 구조물','단당류에는 포도당·과당·갈락토스, 이당류에는 설탕·엿당·젖당이 있다. 다당류인 녹말은 식물의 저장 물질, 글리코젠은 동물의 저장 물질, 셀룰로스는 식물 세포벽의 구성 물질이다. 작은 단위가 결합해 큰 분자가 된다는 공통점을 잡자.'],['지질: 에너지 저장과 막','중성 지방은 글리세롤 1개와 지방산 3개로 이루어진다. 인지질은 지방산 2개와 인산을 포함한 머리를 가진다. 친수성 머리와 소수성 꼬리를 함께 가져 물속에서 이중층을 만든다. 스테로이드는 4개의 고리가 연결된 구조이며 콜레스테롤이 대표적이다.'],['지방산의 모양과 막의 유동성','포화 지방산에는 탄소 사이 이중 결합이 없고, 불포화 지방산에는 있다. 시스형 이중 결합은 꼬리를 굽게 하여 촘촘한 배열을 방해한다. 트랜스형은 불포화 지방산이어도 사슬이 비교적 곧다. “불포화이면 항상 굽어 있다”라고 일반화하지 않는다.'],['단백질과 핵산의 구성 단위','단백질의 단위는 아미노산이며 펩타이드 결합으로 연결된다. 핵산의 단위인 뉴클레오타이드는 당·인산·염기로 구성된다. 물질의 이름, 단위, 결합한 구조, 기능을 한 세트로 기억하자.']],recall:'인지질이 물속에서 이중층을 만드는 이유를 친수성·소수성이라는 말로 설명할 수 있나요?'},
{id:'protein',group:'기초 다지기',title:'단백질과 DNA·RNA',time:12,pages:'12–17',pdf:'7–9',lead:'단백질은 입체 구조로 일하고, 핵산은 염기 서열로 정보를 담는다.',keys:['입체 구조','변성','상보적 결합','역평행'],cards:[['단백질의 네 수준','1차 구조는 아미노산의 배열 순서, 2차 구조는 α 나선·β 병풍 같은 부분 구조, 3차 구조는 한 폴리펩타이드의 전체 입체 구조, 4차 구조는 둘 이상의 폴리펩타이드 소단위체가 결합한 구조이다. 모든 단백질이 4차 구조를 갖는 것은 아니다.'],['구조가 바뀌면 기능도 바뀐다','효소의 활성 부위는 특정 입체 구조를 갖는다. 높은 온도나 극단적인 pH는 이 구조를 변화시켜 기능을 떨어뜨릴 수 있다. 낮은 온도에서 반응이 느려지는 것은 주로 분자 운동 감소 때문이다. 저온과 고온의 이유를 구별하자.'],['DNA와 RNA 비교','DNA: 디옥시리보스, A·T·G·C, 보통 이중 가닥, 유전 정보 저장. RNA: 리보스, A·U·G·C, 보통 단일 가닥, 유전 정보의 발현에 관여. 둘 다 뉴클레오타이드의 중합체이다. DNA의 A–T, G–C는 상보적으로 결합하고 두 가닥의 방향은 반대다.'],['RNA의 역할과 뉴클레오타이드의 재사용','mRNA는 정보를 전달하고, tRNA는 아미노산을 운반하며, rRNA는 라이보솜을 구성한다. ATP와 NAD⁺·FAD·NADP⁺에도 뉴클레오타이드 구성 요소가 들어간다. 같은 구성 요소가 정보 저장·에너지 전달·전자 운반에 다르게 쓰인다.']],recall:'DNA와 RNA의 차이를 당·염기·가닥 수의 세 기준으로 말해 보세요.'},
{id:'research',group:'세포',title:'세포 연구 방법과 실험 해석',time:12,pages:'20–27',pdf:'11–14',lead:'도구 이름보다 “무엇을 알아내는 방법인가”를 연결하자.',keys:['해상력','TEM','SEM','세포 분획법','자기 방사법'],cards:[['현미경 세 가지','광학 현미경은 가시광선을 이용하며 살아 있는 세포를 관찰할 수 있다. TEM(투과 전자 현미경)은 얇은 시료를 통과한 전자로 내부 단면을, SEM(주사 전자 현미경)은 표면에서 얻은 신호로 표면의 입체적 모습을 관찰한다. 전자 현미경의 일반적인 관찰 과정에서는 살아 있는 시료를 보기 어렵다.'],['배율과 해상력을 혼동하지 않기','배율은 얼마나 크게 보이는가, 해상력은 가까운 두 점을 얼마나 잘 구별하는가이다. 구별 가능한 최소 거리가 작을수록 해상력이 좋다. 해상도라는 말은 문맥에 따라 뜻이 달라질 수 있으므로 거리인지 능력인지 확인한다.'],['세포 분획법','세포를 균질화한 뒤 원심 분리의 세기와 시간을 단계적으로 높여 소기관을 분리한다. 큰 구조가 먼저 가라앉는 교과 모형에서 핵 → 엽록체 → 미토콘드리아 → 소포체 조각 → 라이보솜 순으로 살핀다. 앞 단계 침전물을 제거한 상층액을 다음 단계에 사용한다.'],['자기 방사법과 표지 실험','방사성 동위 원소로 표지한 물질의 위치를 추적한다. 분비 단백질은 표지 아미노산이 거친면 소포체의 라이보솜에서 단백질로 합성된 뒤, 소포체 → 골지체 → 분비 소낭 → 세포막 순으로 이동한다. ¹⁴CO₂를 이용한 탄소 경로 추적과도 연결된다.']],recall:'세포의 내부 단면 사진이라면 TEM과 SEM 중 무엇을 고를 건가요?'},
{id:'cell',group:'세포',title:'소기관은 함께 일한다',time:18,pages:'28–37',pdf:'15–19',lead:'소기관을 하나씩 외우기보다 “단백질이 만들어져 분비되는 길”을 따라가자.',keys:['라이보솜','소포체','골지체','라이소솜','구획화'],cards:[['정보 → 단백질 → 분비','핵의 DNA 정보 → mRNA → 라이보솜의 단백질 합성 → 거친면 소포체의 처리·수송 → 골지체의 가공·분류 → 분비 소낭 → 세포외 배출. 골지체의 시스면은 받는 쪽, 트랜스면은 내보내는 쪽이다. 라이보솜은 rRNA와 단백질로 구성된 비막성 구조다.'],['소포체와 라이소솜','거친면 소포체에는 라이보솜이 붙어 분비·막단백질의 합성과 처리에 관여한다. 매끈면 소포체는 지질 합성·해독 등에 관여한다. 라이소솜은 산성에서 작용하는 가수 분해 효소로 물질과 낡은 소기관을 분해한다. 막은 효소를 격리하고 적절한 환경을 유지한다.'],['핵·액포·골격','핵은 핵막·핵공·염색질·인을 포함한다. 인은 라이보솜 구성 요소 형성과 연결된다. 식물의 액포는 저장과 삼투·팽압 유지에 관여한다. 미세 소관은 세포 내 수송과 방추사, 섬모·편모 등에, 미세 섬유는 세포 운동·수축 등에 관여하고 중간 섬유는 기계적 지지에 관여한다.'],['미토콘드리아·엽록체와 세포의 구분','두 소기관은 이중막·자체 DNA·라이보솜을 갖고 분열하며, 세포내 공생설의 근거가 된다. 미토콘드리아 내막의 주름은 크리스타, 엽록체의 막 주머니는 틸라코이드다. 원핵세포는 핵막과 막성 소기관이 없지만 DNA·세포막·라이보솜은 있다. 진핵세포의 구획화는 서로 다른 환경의 반응을 효율적으로 진행하게 한다.']],recall:'자가포식을 소기관의 연결과 호흡 기질의 재활용으로 설명해 보세요.'},
{id:'membrane',group:'세포',title:'세포막과 물질 수송',time:15,pages:'38–45',pdf:'20–23',lead:'“어느 방향인가, 단백질이 필요한가, 에너지가 필요한가” 세 질문으로 분류한다.',keys:['선택적 투과성','유동 모자이크막','확산','능동수송'],cards:[['막의 구조와 기능','인지질 이중층에 단백질이 모자이크처럼 분포하며 인지질과 일부 단백질은 옆으로 이동한다. 크기·전하와 극성·지용성에 따라 통과 정도가 다른 선택적 투과성을 갖는다. 작고 비극성인 O₂·CO₂는 잘 통과하지만 이온은 소수성 내부를 쉽게 통과하지 못한다.'],['단순 확산과 촉진 확산','둘 다 농도 또는 전기화학적 기울기를 따르며 ATP를 직접 쓰지 않는다. 단순 확산은 인지질층을 통과한다. 촉진 확산은 통로·운반 단백질을 이용한다. 교과서의 운반체 매개 수송 그래프는 단백질 수가 제한되어 포화된다. 단백질을 쓴다고 모두 능동수송인 것은 아니다.'],['능동수송과 Na⁺–K⁺ 펌프','에너지를 사용하여 기울기를 거슬러 물질을 이동시킨다. Na⁺–K⁺ 펌프는 ATP를 이용하여 Na⁺ 3개를 밖으로, K⁺ 2개를 안으로 이동시킨다. 미토콘드리아 전자 전달계가 H⁺를 한쪽에 모으는 과정도 에너지가 필요한 수송이다.'],['소낭 수송','세포내 섭취는 세포막이 물질을 감싸 소낭으로 들이는 과정, 세포외 배출은 소낭과 세포막이 융합하여 내용물을 내보내는 과정이다. 둘 다 에너지를 사용한다. 병원체 섭취는 라이소솜의 소화와, 호르몬 분비는 소포체·골지체와 연결한다.']],recall:'ATP 합성 효소를 통한 H⁺ 이동은 기울기를 따를까요, 거스를까요?'},
{id:'osmosis',group:'세포',title:'삼투·삼투압·팽압·흡수력',time:12,pages:'40–45',pdf:'21–23',lead:'물이 움직이는 방향과, 물이 들어온 뒤 세포벽이 미는 힘을 나누어 생각하자.',keys:['삼투','원형질 분리','팽압','흡수력'],cards:[['물은 어디로 움직일까?','선택적 투과성 막을 사이에 두고 물은 용질 농도가 낮은 쪽에서 높은 쪽으로 순이동한다는 기본 모형을 사용한다. 세포에 대한 저장액에서는 세포로 물이 들어오고, 고장액에서는 물이 빠져나간다. 평형에서도 물 분자의 왕복 이동은 계속된다.'],['동물 세포와 식물 세포','적혈구는 저장액에서 팽창하다 용혈될 수 있고 고장액에서 수축한다. 식물은 고장액에서 세포막이 세포벽에서 떨어지는 원형질 분리가 일어난다. 저장액에서는 세포벽이 팽창을 제한하여 팽윤 상태가 된다. 수축포는 과잉 유입된 물을 내보낸다.'],['그래프의 기준식','흡수력 = 삼투압 − 팽압. 부피가 증가하면 세포액이 묽어져 삼투압은 감소한다. 세포벽을 누르기 시작하면 팽압이 증가한다. 한계 원형질 분리에서는 팽압이 0, 완전 팽윤에서는 삼투압과 팽압이 같아 흡수력이 0이다.'],['서술형의 답안 순서','① 물의 순이동 → ② 부피·농도 변화 → ③ 삼투압·팽압 변화 → ④ 흡수력. 기출처럼 삼투압과 흡수력이 주어지면 두 곡선의 세로 차이가 팽압이다. “평형이라 물이 전혀 이동하지 않는다”는 표현은 피한다.']],recall:'완전 팽윤에서 흡수력이 0이라고 삼투압도 0일까요?'},
{id:'energy',group:'물질대사',title:'물질대사·ATP·산화 환원',time:12,pages:'54–65, 88–89',pdf:'28–33, 45',lead:'ATP는 지금 쓸 에너지, NADH는 전자를 운반하는 물질이라고 구별해 보자.',keys:['동화작용','이화작용','ATP','산화','환원'],cards:[['동화와 이화','동화작용은 작은 물질로 큰 물질을 합성하며 에너지를 흡수하는 방향이다. 광합성과 단백질 합성이 예다. 이화작용은 큰 물질을 분해하며 에너지를 방출하는 방향이다. 세포호흡이 예다. 대사 과정에는 효소가 관여한다.'],['ATP의 순환','ATP는 아데닌·리보스·인산 3개로 구성된다. ATP 가수 분해의 전체 반응에서 방출되는 에너지를 생명 활동에 연결하고, ADP와 무기 인산(Pi)에 에너지를 공급해 ATP를 재생한다. 결합을 끊는 행위 자체가 에너지를 내놓는다고만 설명하지 않는다.'],['전자를 얻으면 환원, 잃으면 산화','기질이 산화될 때 NAD⁺가 전자를 받아 NADH로 환원될 수 있다. NADH가 전자 전달계에 전자를 내주면 다시 NAD⁺로 산화된다. FAD↔FADH₂, NADP⁺↔NADPH도 같은 틀로 읽는다. 산화·환원은 짝을 이루며 진행된다.'],['에너지 소비와 열','기초 대사량은 공복·안정 상태에서 생명 유지에 필요한 최소 에너지 소비량이다. 소화·활동 에너지는 구별한다. 세포호흡에서 유기물의 에너지가 모두 ATP에 저장되지는 않고 일부는 열로 방출된다. 운동 시 ATP 수요가 증가하면 세포호흡과 열 발생이 증가한다.']],recall:'NADH와 ATP가 같은 역할을 하는 물질이라고 말할 수 있을까요?'},
{id:'enzyme',group:'물질대사',title:'효소의 작용·저해·그래프',time:18,pages:'66–81',pdf:'34–41',lead:'그래프 문제는 “활성 부위”와 “효소의 수”를 먼저 떠올리면 풀린다.',keys:['활성화 에너지','활성 부위','기질 특이성','포화','경쟁적 저해'],cards:[['효소가 바꾸는 것','효소는 활성화 에너지를 낮춰 반응 속도를 높이는 생체 촉매다. 기질과 활성 부위의 구조가 맞아 효소–기질 복합체를 형성한다. 반응 후 다시 사용할 수 있다. 전체 에너지 변화량이나 평형 자체를 바꾸는 것은 아니다.'],['효소의 구성과 환경','대부분 단백질이며 보조 인자가 필요한 효소도 있다. 단백질 부분은 주효소, 필요한 보조 인자가 결합해 기능하는 전체는 전효소로 구분한다. 유기 보조 인자는 조효소다. 온도·pH·기질 농도가 활성에 영향을 준다. 고온에서는 변성, 저온에서는 분자 운동 감소를 연결한다.'],['기질 농도와 포화','효소량이 일정할 때 기질을 늘리면 복합체가 더 많이 형성되어 반응 속도가 증가한다. 충분히 많아지면 활성 부위가 거의 점유되어 최대 속도에 이른다. 효소량을 늘리면 최대 속도가 올라갈 수 있다.'],['경쟁적·비경쟁적 저해','경쟁적 저해제는 활성 부위에서 기질과 경쟁한다. 기질을 충분히 늘리면 최대 속도는 회복되며 겉보기 Km은 증가한다. 교과의 순수 비경쟁적 모형은 다른 부위 결합으로 기능을 낮추므로 최대 속도가 감소하고 Km은 일정하다. Km은 그 조건의 최대 속도의 절반에 해당하는 기질 농도다.']],recall:'기질을 아무리 늘려도 최대 속도가 회복되지 않으면 어떤 저해를 떠올릴까요?'},
{id:'resp-intro',group:'세포호흡',title:'세포호흡의 큰 그림',time:10,pages:'84–95',pdf:'43–48',lead:'포도당을 조금씩 산화하고, 그 에너지를 ATP로 옮기는 이야기다.',keys:['세포질','바탕질','내막','전자 전달계'],cards:[['먼저 네 장면만 기억하기','① 해당: 포도당을 두 피루브산으로 나눈다. ② 피루브산 산화: 탄소 하나를 떼고 아세틸 CoA를 만든다. ③ TCA 회로: 남은 아세틸기의 산화와 전자 회수가 진행된다. ④ 산화적 인산화: 회수한 전자로 H⁺ 기울기를 만들고 ATP를 합성한다. 교과서에서는 ②·③을 묶어 세 단계로 설명한다.'],['장소가 다른 이유','해당은 세포질, 피루브산 산화·TCA 회로는 미토콘드리아 바탕질, 전자 전달계와 ATP 합성 효소는 내막에 있다. 바탕질은 기질(matrix)이라고도 한다. 반응 효소와 막 구조가 필요한 장소에 배치되어 있다.'],['탄소와 전자를 따로 추적하기','탄소 흐름은 포도당 → 피루브산 → 아세틸 CoA → CO₂. 전자 흐름은 유기물 → NADH·FADH₂ → 전자 전달계 → O₂. CO₂는 탄소가 빠져나오는 산물이고, O₂는 마지막에 전자를 받아 H₂O가 되는 물질이다.'],['세 종류의 인산화','기질수준 인산화: 기질의 인산기를 ADP에 직접 전달. 산화적 인산화: 호흡 전자 전달계와 화학 삼투를 이용. 광인산화: 빛에 의해 시작되는 전자 전달과 화학 삼투를 이용. 장소·에너지원·막 필요 여부로 비교한다.']],recall:'세포호흡에서 CO₂가 만들어지는 것과 O₂가 쓰이는 것은 같은 단계인가요?'},
{id:'glycolysis',group:'세포호흡',title:'해당: 먼저 쓰고, 나중에 회수',time:12,pages:'88–89',pdf:'45',lead:'6탄소 하나 → 3탄소 둘. ATP의 총생성과 순생성을 구별한다.',keys:['세포질','2 ATP 투자','4 ATP 생성','2 NADH'],cards:[['에너지 투자','세포질에서 포도당 1분자에 ATP 2분자를 투자하여 인산화한다. 과당 2인산을 거쳐 인산화된 3탄소 물질 두 개로 나눈다. 탄소 수를 늘리는 것이 아니라 뒤의 분해·에너지 회수에 적합하게 만드는 과정이다.'],['에너지 회수','3탄소 물질 두 개가 피루브산으로 전환되는 동안 NAD⁺가 환원되어 총 2 NADH가 생성된다. 기질수준 인산화로 ATP 4분자가 만들어진다. 처음 쓴 2분자를 빼면 순생성은 2 ATP다.'],['포도당 하나를 기준으로','산물: 피루브산 2, NADH 2, 순 ATP 2. 해당에서는 CO₂가 나오지 않는다. 6탄소가 두 3탄소로 나뉘므로 탄소가 모두 남아 있다. O₂를 직접 쓰지 않아서 산소가 없어도 진행할 수 있다.'],['기출·교과 탐구 연결','에너지 그래프 초반의 상승은 ATP 투자, 후반의 하강은 산화와 에너지 회수다. ATP가 전혀 없는 무산소 시험관에 포도당만 넣으면 시작 인산화가 막힐 수 있다. 이미 인산화된 과당 2인산은 이 초기 단계를 우회할 수 있다.']],recall:'“해당에서 ATP가 4개 생긴다”와 “순생성이 2개다”가 동시에 맞는 이유는?'},
{id:'tca',group:'세포호흡',title:'피루브산 산화와 TCA 회로',time:15,pages:'90–91',pdf:'46',lead:'3 → 2, 그리고 2 + 4 → 6 → 5 → 4. 탄소 수를 먼저 따라가자.',keys:['탈탄산','NADH','옥살아세트산','아세틸 CoA'],cards:[['피루브산 한 분자의 산화','미토콘드리아 바탕질에서 3탄소 피루브산이 CO₂ 1개를 잃고 2탄소 아세틸 CoA가 된다. 이때 NADH 1개가 만들어진다. ATP가 직접 생성되는 단계는 아니다. 탈탄산과 탈수소를 구별하여 쓴다.'],['TCA 한 바퀴','아세틸기의 2탄소가 옥살아세트산 4탄소와 결합해 시트르산 6탄소가 된다. 6 → 5 → 4 과정에서 CO₂가 두 번 나오고, 이어 옥살아세트산이 재생된다. 아세틸 CoA 1분자당 NADH 3, FADH₂ 1, ATP 상당량 1, CO₂ 2가 생성된다.'],['포도당 한 분자라면 두 배','포도당 1 → 피루브산 2이므로 연결 반응과 TCA가 각각 두 번 진행된다. 피루브산 산화: 2 NADH·2 CO₂. TCA: 6 NADH·2 FADH₂·2 ATP·4 CO₂. 교과서에서는 TCA의 ATP 상당량을 ATP로 계산한다.'],['왜 산소가 없으면 계속하기 어려울까?','이 단계들이 O₂를 직접 사용하지는 않는다. 하지만 O₂가 없으면 전자 전달계가 멈추어 NADH의 재산화가 어려워지고 NAD⁺가 부족해진다. 그래서 피루브산 산화와 TCA도 지속되기 어렵다. “산소 직접 소비”와 “산소에 간접 의존”을 구별한다.']],recall:'피루브산 1개가 연결 반응과 TCA를 모두 거치면 NADH는 총 몇 개일까요?'},
{id:'etc',group:'세포호흡',title:'산화적 인산화와 ATP 장부',time:18,pages:'92–95',pdf:'47–48',lead:'전자 → H⁺ 기울기 → ATP. 이 세 화살표를 말로 설명할 수 있으면 된다.',keys:['내막','막 사이 공간','화학 삼투','산소','ATP 합성 효소'],cards:[['전자의 이동','NADH·FADH₂가 내막의 전자 전달계에 전자를 준다. 전자는 여러 산화 환원 반응을 거쳐 O₂로 전달된다. O₂는 전자와 H⁺를 받아 물로 환원된다. 에너지를 단계적으로 방출하기 때문에 H⁺ 수송과 연결할 수 있다.'],['H⁺의 두 방향','전자 전달에서 방출된 에너지로 H⁺를 바탕질 → 막 사이 공간으로 이동시킨다. 막 사이 공간은 H⁺가 많아지고 pH가 낮아진다. H⁺가 ATP 합성 효소를 통해 막 사이 공간 → 바탕질로 돌아올 때 ATP가 합성된다. 이것이 화학 삼투다.'],['교과서 기준: 최대 32 ATP','교과서 93쪽의 모형은 NADH 1개당 2.5 ATP, FADH₂ 1개당 1.5 ATP다. 포도당 1개당 (10×2.5)+(2×1.5)=28 ATP가 산화적 인산화로 생성된다. 해당 2 + TCA 2를 더하면 최대 32 ATP다. 실제 진핵세포에서는 셔틀 등에 따라 30~32로 설명하지만 이 사이트의 기본 계산은 제공 교과서의 32다.'],['교과 탐구와 융합','내막이 H⁺를 자유롭게 통과시키면 기울기가 유지되지 못해 ATP 합성이 감소한다. 전자 전달 억제는 H⁺ 수송을 줄이고, ATP 합성 효소 억제는 H⁺의 귀환을 막는다. 서로 다른 지점을 막으므로 pH 변화까지 무조건 같다고 생각하지 않는다.']],recall:'H⁺가 많은 곳과 ATP가 생성되는 쪽을 각각 말해 보세요.'},
{id:'fermentation',group:'세포호흡',title:'발효: NAD⁺를 되살리는 길',time:12,pages:'96–103',pdf:'49–52',lead:'발효의 핵심은 추가 ATP가 아니라 NAD⁺ 재생이다.',keys:['NAD⁺ 재생','세포질','젖산','에탄올','기질수준 인산화'],cards:[['해당을 멈추지 않게 하기','산소 부족 등으로 호흡 전자 전달계를 이용하기 어려울 때, NADH의 전자를 유기 분자에 전달하여 NAD⁺를 재생한다. 해당에서 필요한 NAD⁺가 다시 공급되므로 포도당당 순 2 ATP를 계속 얻을 수 있다. 발효의 환원 단계 자체에서 ATP가 추가로 생기는 것은 아니다.'],['젖산 발효와 알코올 발효','젖산: 피루브산(3C) → 젖산(3C), CO₂ 발생 없음. 알코올: 피루브산(3C) → 아세트알데하이드(2C)+CO₂ → 에탄올(2C). 둘 다 세포질에서 일어나고 NADH가 산화되어 NAD⁺가 재생된다.'],['효모 발효 탐구','기질 종류를 바꿀 때 온도·효모량·용액 부피·반응 시간을 일정하게 하고 CO₂ 발생량을 비교한다. 일반적인 효모는 포도당은 이용하지만 녹말을 직접 잘 분해하지 못한다. 끓인 효모에서는 단백질 효소의 변성 등으로 발효가 일어나기 어렵다. 석회수의 혼탁으로 CO₂를 확인할 수 있다.'],['발효와 다른 산화 과정 구별','뷔흐너의 무세포 효모 추출액 실험은 생세포 자체가 없어도 효소가 발효를 진행할 수 있음을 보였다. 알코올 용액을 공기와 접촉시켜 식초가 생기는 것은 아세트산균이 산소를 이용하여 에탄올을 산화하는 과정이다. 젖산·알코올 발효와 같은 무산소 과정으로 설명하지 않는다.']],recall:'발효가 없다면 산소 부족 상태에서 해당이 왜 멈추게 될까요?'},
{id:'pigment',group:'광합성',title:'엽록체·색소·빛의 흡수',time:12,pages:'104–109',pdf:'53–55',lead:'빛을 받는 막과 탄소를 고정하는 공간을 먼저 구별한다.',keys:['틸라코이드','스트로마','엽록소','흡수 스펙트럼','작용 스펙트럼'],cards:[['엽록체의 구조','엽록체는 이중막으로 둘러싸인다. 내부의 납작한 막 주머니는 틸라코이드, 그 더미는 그라나, 그 주위를 채우는 액체는 스트로마다. 명반응은 틸라코이드 막에서, 탄소 고정반응은 스트로마에서 일어난다. “틸라코이드 내부”와 “틸라코이드 막”을 구분한다.'],['색소의 역할','엽록소 a·b와 카로티노이드가 빛을 흡수한다. 광계 반응 중심 색소는 엽록소 a다. 보조 색소는 흡수 범위를 넓히고 에너지를 반응 중심으로 전달한다. 엽록소는 주로 청자색·적색광을 흡수한다. 녹색광은 상대적으로 적게 흡수되지만 광합성이 항상 0인 것은 아니다.'],['두 스펙트럼','흡수 스펙트럼은 파장별 빛 흡수 정도, 작용 스펙트럼은 파장별 광합성 효과를 나타낸다. 작용 스펙트럼에는 여러 색소의 기여가 반영된다. 같은 조건에서 산소 발생량을 비교할 때 빛의 세기 또는 광자 조건도 확인한다.'],['크로마토그래피 탐구','색소마다 전개액에 대한 용해도와 종이에 대한 흡착력이 달라 분리된다. 교과의 비극성 전개액에서 멀리 이동하는 순서는 카로틴 → 잔토필 → 엽록소 a → 엽록소 b다. 원점은 전개액에 잠기지 않게 한다. 엽록소가 분해되면 이미 존재하던 카로티노이드가 더 드러날 수 있다.']],recall:'잎이 녹색이라는 사실이 녹색광을 가장 잘 흡수한다는 뜻일까요?'},
{id:'light',group:'광합성',title:'명반응: 빛으로 ATP와 NADPH',time:15,pages:'110–113',pdf:'56–57',lead:'물에서 시작한 전자가 두 광계를 거쳐 NADP⁺에 도착한다.',keys:['광계 II','광계 I','물의 광분해','NADPH','광인산화'],cards:[['비순환적 전자 흐름','물 → 광계 II(P680) → 전자 전달계 → 광계 I(P700) → NADP⁺. 빛을 흡수해 들뜬 전자는 반응 중심에서 나와 전달된다. 광계 II가 잃은 전자는 물의 광분해로 보충되고 O₂가 나온다. NADP⁺가 전자와 H⁺를 받아 NADPH가 된다.'],['ATP는 어디에서 만들어질까?','전자 전달 에너지로 H⁺를 스트로마에서 틸라코이드 내부로 이동시킨다. 물의 광분해도 내부에 H⁺를 공급한다. H⁺가 ATP 합성 효소를 통해 내부 → 스트로마로 흐를 때 ATP가 생성된다. ATP·NADPH는 스트로마의 탄소 고정반응에 공급된다.'],['순환적 전자 흐름','광계 I에서 나온 전자가 전자 전달계를 거쳐 광계 I로 돌아온다. H⁺ 기울기와 ATP 생성에 기여하지만, 이 경로 자체는 NADPH나 O₂를 만들지 않는다. 비순환 경로와 사용하는 광계·전자 도착점·산물로 비교한다.'],['빛을 끄면?','빛에 의한 전자의 들뜸이 멈춰 ATP·NADPH의 지속적인 공급이 줄어든다. 이미 만들어진 물질 때문에 탄소 고정이 잠시 이어질 수 있지만 오래 유지되지는 못한다. “명반응에서 CO₂를 고정한다”거나 “광합성 O₂가 CO₂에서 나온다”라고 쓰지 않는다.']],recall:'비순환 경로의 산물 세 가지와 순환 경로의 산물을 말해 보세요.'},
{id:'calvin',group:'광합성',title:'캘빈 회로: 탄소를 붙이고 환원',time:18,pages:'114–115, 127',pdf:'58, 64',lead:'탄소 고정 → 3PG 환원 → RuBP 재생. ATP와 NADPH를 쓰는 곳을 표시한다.',keys:['RuBP','3PG','PGAL','탄소 고정','환원','재생'],cards:[['① 탄소 고정','3 CO₂(각 1C)가 3 RuBP(각 5C)와 결합한다. 불안정한 6탄소 중간체가 갈라져 6개의 3PG(각 3C)가 된다. 총 탄소는 3+15=18로 보존된다. 장소는 스트로마다. 최초의 안정한 탄소 고정 산물은 3PG다.'],['② 3PG 환원','6개의 3PG에 6 ATP와 6 NADPH가 사용되어 6개의 PGAL(=G3P)이 된다. ATP는 에너지를, NADPH는 환원에 필요한 전자를 제공한다. 6개의 PGAL 중 1개(3C)가 순생성물로 빠져나와 유기물 합성에 쓰인다.'],['③ RuBP 재생','남은 5 PGAL(총 15C)에 3 ATP가 쓰여 3 RuBP(총 15C)를 재생한다. 3 CO₂ 고정과 PGAL 1개 순생성에는 9 ATP·6 NADPH가 필요하다. 포도당 1분자에 해당하는 탄소량은 6 CO₂·18 ATP·12 NADPH다. 회로에서 곧바로 포도당 1개가 나오는 것으로 그리지 않는다.'],['조건 변화 직후의 농도','빛 유지·CO₂ 차단: 고정이 멈추고 환원·재생이 잠시 계속 → 3PG 감소, RuBP 증가. CO₂ 유지·빛 차단: ATP·NADPH 공급이 줄어 환원·재생이 제한 → 3PG 증가, RuBP 감소. 교과의 단순화된 모형에서 변화 직후를 비교하는 설명이다.']],recall:'PGAL 6개 중 왜 5개를 다시 회로에 넣어야 할까요?'},
{id:'compare',group:'융합 정리',title:'세포호흡 × 광합성 × 막 × 효소',time:15,pages:'116–117',pdf:'59',lead:'두 과정을 잇는 공통 원리는 막을 사이에 둔 H⁺ 기울기다.',keys:['산화 환원','H⁺ 기울기','화학 삼투','ATP 합성 효소'],cards:[['공통점 세 가지','① 막의 전자 전달계를 따라 연속적인 산화 환원이 일어난다. ② 방출되는 에너지로 H⁺ 기울기를 형성한다. ③ H⁺가 ATP 합성 효소를 통해 기울기를 따라 이동하면서 ATP를 합성한다. “둘 다 ATP를 만든다”만 쓰기보다 과정의 연결을 쓴다.'],['호흡의 기준표','막: 미토콘드리아 내막. 전자 공급: NADH·FADH₂. 최종 전자 수용체: O₂. H⁺ 축적: 막 사이 공간. ATP 합성 시 H⁺ 이동: 막 사이 공간 → 바탕질. 에너지: 유기물의 화학 에너지 → ATP의 화학 에너지와 열.'],['광합성 비순환 경로의 기준표','막: 틸라코이드 막. 최초 전자 공급: 물. 최종 수용체: NADP⁺. H⁺ 축적: 틸라코이드 내부. ATP 합성 시 이동: 내부 → 스트로마. 에너지: 빛에너지 → 화학 에너지. 순환적 경로는 전자가 광계 I으로 돌아온다.'],['세 단원을 연결하는 서술','인지질층은 H⁺가 자유롭게 새지 않게 하여 기울기를 유지한다(막). 전자 전달 단백질과 ATP 합성 효소가 작용한다(단백질·효소). 기울기의 에너지가 ATP 합성에 연결된다(대사). 고온·pH·막 손상 조건을 주면 이 연결의 어느 부분이 변했는지 설명한다.']],recall:'두 과정이 단순히 같은 반응 경로의 정방향·역방향이라고 볼 수 없는 이유는?'},
{id:'history',group:'융합 정리',title:'과학사와 탐구의 결론',time:18,pages:'77, 98, 111, 114, 118–121',pdf:'39, 50, 56, 58, 60–61',lead:'인물 → 실험 조작 → 관찰 → 결론. 인명만 외우지 않는다.',keys:['효소 연구사','동위 원소','탄소 경로','H⁺ 기울기'],cards:[['효소 연구사: 교과서에 나온 다섯 인물','스팔란차니: 위액의 고기 소화 작용. 슈반: 펩신 발견. 섬너: 유레이스(요소 분해 효소) 결정화와 단백질 성분. 노스럽: 펩신·트립신 등 결정화. 필립스: 라이소자임 입체 구조 규명. 교과서는 이를 발견 → 구성 성분 규명 → 입체 구조 규명 → 인공 효소 개발로 묶는다. 친구 요약본의 대표 인물 목록과 달라 교과서 명단을 우선했다.'],['초기의 광합성 연구','프리스틀리: 식물이 연소·호흡으로 변한 공기를 회복. 잉엔하우스: 빛과 식물의 녹색 부분이 중요. 작스: 빛을 받은 잎에서 녹말 생성 확인. 엥겔만: 프리즘과 호기성 세균으로 청자색·적색광 부근 산소 발생이 활발함을 확인.'],['물의 산화와 탄소 경로','힐: 분리 엽록체·빛·전자 수용체가 있으면 CO₂ 고정 없이도 O₂ 발생. 루벤: ¹⁸O로 표지한 물에서 표지 산소가 나와 방출 O₂의 기원이 물임을 확인(¹⁸O는 안정 동위 원소). 벤슨: 빛 조건·CO₂ 공급을 바꾸어 명반응과 탄소 고정반응의 연결을 조사. 캘빈: ¹⁴CO₂·크로마토그래피·자기 방사법으로 3PG와 탄소 경로를 추적.'],['ATP 합성의 원인','아논: 분리 엽록체의 광인산화. 야겐도르프: 암실에서 틸라코이드를 pH 4에 두었다가 ADP·Pi가 있는 pH 8 용액으로 옮기면 일시적 ATP 생성. 내부 H⁺가 밖으로 흐르는 기울기가 핵심이다. 교과서 121쪽의 반대 조건(pH 8 → 4) 질문에서는 같은 방향의 ATP 합성을 기대하지 않는다.']],recall:'야겐도르프 실험에서 “암실”이라는 조건이 왜 중요한가요?'}
];

LESSONS.push({id:'experiments',group:'융합 정리',title:'탐구 설계와 자료 해석',time:12,pages:'42–43, 62–63, 72–73, 100–101, 108–109',pdf:'22, 32, 37, 51, 55',lead:'조건을 하나 바꾸고, 나머지를 같게 하고, 관찰 결과로 결론을 낸다.',keys:['조작 변인','종속 변인','통제 변인','대조군'],cards:[['세 변인을 구별하기','조작 변인은 의도적으로 바꾼 조건, 종속 변인은 그 결과 측정하는 값, 통제 변인은 같게 유지할 조건이다. 효모 기질 비교에서 기질 종류는 조작, 일정 시간의 기체 발생량은 종속, 효모량·온도·용액 부피·시간은 통제 변인이다.'],['그래프 읽기 4단계','① 가로축·세로축과 단위 → ② 고정한 조건 → ③ 증가·감소·포화 또는 차이 → ④ 개념으로 원인 설명. 효소량 일정이라는 조건 없이 포화 그래프를 해석하지 않는다. 두 곡선의 단순 높이 차이와 기울기 차이도 구별한다.'],['대조군을 두는 까닭','처리한 조건 때문에 결과가 달라졌는지 비교하기 위해서다. 효소 실험은 효소 없는 조건 또는 끓인 효소 조건 등을 목적에 맞게 비교한다. 호흡 실험에서는 생물 유무·상태를 통제하고, 생긴 CO₂를 석회수 변화 등으로 확인한다. 관찰한 것과 추론한 것을 분리하여 쓴다.'],['탐구 서술형의 문장 틀','“X를 바꾸고 A·B·C를 같게 유지하여 Y를 측정하였다. 처리군에서 Y가 달라졌으므로, ○○ 조건에서 X가 Y에 영향을 주었다고 해석한다.” 단일 실험을 모든 조건으로 일반화하지 않는다. 준비물·절차보다 조작과 관찰, 결론을 연결하는 키워드를 우선한다.']],recall:'기질 종류에 따른 효모의 발효를 비교할 때 일정하게 할 조건을 3가지 말해 보세요.'});

const QUESTIONS = [];
function Q(id,topic,type,title,answer,criteria,source,warning=''){QUESTIONS.push({id,topic,type,title,answer,criteria:criteria.map(c=>({label:c[0],terms:c.slice(1)})),source,warning});}
Q('k1','basics','3가지','인지질의 구조와 막 형성 원리를 핵심 내용 3가지로 쓰시오.','① 친수성 머리와 소수성 꼬리를 가진다. ② 머리는 물을 향하고 꼬리는 안쪽을 향하여 인지질 이중층을 형성한다. ③ 소수성 내부는 이온·극성 물질의 통과를 제한하여 선택적 투과성에 기여한다.',[['친수성 머리','친수성'],['소수성 꼬리','소수성'],['이중층과 선택적 투과성','선택적투과','이중층']], '교과서 10·38–39쪽 · 기출 6번 유형','이중층만 쓰고 머리·꼬리의 방향을 뒤집지 않았는지 확인하세요.');
Q('k2','protein','3가지','DNA와 RNA의 차이를 당·염기·가닥 수로 나누어 쓰시오.','DNA는 디옥시리보스·T를 포함하며 보통 이중 가닥, RNA는 리보스·U를 포함하며 보통 단일 가닥이다.',[['당 비교','디옥시리보스'],['염기 비교','티민&유라실','T&U'],['가닥 수 비교','이중','두가닥']], '교과서 12–15쪽','DNA와 RNA 각각의 당, T/U, 이중/단일을 모두 짝지어 썼는지 확인하세요.');
Q('k3','protein','융합','고온이나 pH 변화가 효소 기능을 저하시키는 까닭을 단백질 구조와 연결하시오.','단백질의 입체 구조가 변성되어 활성 부위의 모양이 변하면 기질과의 결합 및 촉매 작용이 저하된다.',[['입체 구조','입체구조'],['변성','변성'],['활성 부위','활성부위'],['기질 결합','기질']], '교과서 15·70–71쪽','저온의 주된 원인을 변성이라고 쓰지 않습니다.');
Q('k4','research','기출형','세포 운동 소기관의 내부 단면을 관찰할 전자 현미경을 고르고, 표면 관찰용과 구분하시오.','내부 단면은 TEM(투과 전자 현미경), 표면의 입체적 모습은 SEM(주사 전자 현미경)으로 관찰한다.',[['TEM 또는 투과','TEM','투과'],['내부 단면','내부','단면'],['SEM 또는 주사','SEM','주사'],['표면','표면']], '교과서 24쪽 · 기출 3번 유형');
Q('k5','research','기출형','방사성 아미노산을 이용해 분비 단백질의 합성·이동을 추적하는 원리와 경로를 쓰시오.','표지 아미노산이 단백질에 포함되므로 방사성 신호로 이동을 추적한다. 거친면 소포체의 라이보솜에서 합성된 뒤 소포체 → 골지체 → 분비 소낭 → 세포막 순으로 이동한다.',[['방사성 표지','방사','표지'],['소포체','소포체'],['골지체','골지체'],['소낭','소낭'],['세포막','세포막']], '교과서 25·30–31쪽 · 기출 2번 유형','키워드뿐 아니라 소포체 → 골지체 → 소낭 → 세포막 순서도 확인하세요.');
Q('k6','cell','3가지','미토콘드리아와 엽록체의 세포내 공생설을 뒷받침하는 특징을 3가지 쓰시오.','자체 DNA, 자체 라이보솜, 분열에 의한 증식. 이중막도 관련 근거로 설명할 수 있다.',[['자체 DNA','DNA'],['라이보솜','라이보솜','리보솜'],['분열','분열']], '교과서 32·37쪽','이중막을 대신 썼다면 모범답안과 비교해 스스로 확인하세요. 자동 검사는 지정된 세 항목을 확인합니다.');
Q('k7','cell','기출형','골지체의 시스면과 트랜스면을 구분하고 단백질의 변화를 설명하시오.','소포체에서 온 소낭은 시스면으로 들어오며 단백질이 가공·분류된다. 트랜스면에서 목적지에 따라 소낭에 담겨 나간다.',[['시스면','시스'],['트랜스면','트랜스'],['가공','가공','변형'],['분류','분류','선별']], '교과서 30–31쪽 · 기출 2번 유형','시스=받음, 트랜스=내보냄의 방향을 확인하세요.');
Q('k8','cell','융합','라이소솜의 생성과 자가포식을 DNA·라이보솜·소포체·골지체·호흡 기질로 연결하시오.','DNA 정보에 따라 라이보솜에서 가수 분해 효소가 합성되고 소포체와 골지체를 거쳐 라이소솜으로 전달된다. 자가포식으로 낡은 구성 성분을 분해해 영양분과 호흡 기질을 재활용한다.',[['DNA','DNA'],['라이보솜','라이보솜','리보솜'],['소포체','소포체'],['골지체','골지체'],['가수 분해 효소','가수분해'],['재활용','재활용','호흡기질']], '교과서 31·50쪽 · 기출 2번 연계');
Q('k9','membrane','3가지','단순 확산·촉진 확산·능동수송을 방향, 수송 단백질, 에너지 사용으로 비교하시오.','단순 확산은 기울기를 따라 인지질층을 통과하며 ATP를 직접 쓰지 않는다. 촉진 확산도 기울기를 따르지만 수송 단백질을 쓴다. 능동수송은 에너지를 써 기울기를 거스르는 수송이다.',[['기울기/농도','기울기','농도'],['수송 단백질','단백질'],['에너지','에너지','ATP'],['거스름','거슬','거스','낮은곳에서높은']], '교과서 40·44쪽','방향과 에너지의 대응 관계는 모범답안과 직접 비교하세요.');
Q('k10','osmosis','기출형','식물 세포 부피가 증가할 때 삼투압·팽압·흡수력의 변화와 완전 팽윤 조건을 쓰시오.','부피가 증가하면 세포액이 묽어져 삼투압은 감소한다. 세포벽을 밀면서 팽압은 증가한다. 흡수력=삼투압−팽압이므로 감소하며 완전 팽윤에서는 삼투압과 팽압이 같아 흡수력이 0이다.',[['삼투압','삼투압'],['팽압','팽압'],['흡수력','흡수력'],['0','0','영']], '교과서 43쪽 · 기출 4번 유형','삼투압↓, 팽압↑, 흡수력↓인지 반드시 확인하세요.');
Q('k11','enzyme','기출형','기질 농도를 높여도 효소 반응 속도가 더 이상 증가하지 않는 이유를 쓰시오.','효소의 수가 한정되어 있고 활성 부위가 기질에 의해 거의 모두 점유되면 효소–기질 복합체 형성이 포화되어 최대 반응 속도에 도달한다.',[['효소 수 제한','한정','일정','제한'],['활성 부위','활성부위'],['포화','포화','점유','모두결합'],['최대 속도','최대']], '교과서 70쪽 · 기출 5번 유형');
Q('k12','enzyme','기출형','경쟁적 저해와 순수 비경쟁적 저해에서 Km·Vmax 변화를 비교하시오.','경쟁적: 활성 부위에서 기질과 경쟁, Km 증가·Vmax 일정. 순수 비경쟁적: 다른 부위 결합으로 기능 감소, Km 일정·Vmax 감소. 경쟁적 저해는 기질 농도를 높이면 완화된다.',[['활성 부위','활성부위'],['다른 부위','다른부위','활성부위이외'],['Km','Km'],['Vmax','Vmax','최대반응속도']], '교과서 71쪽·수업 필기 · 기출 5번 유형','Km/Vmax라는 단어만으로 변화 방향까지 맞았다는 뜻은 아닙니다.');
Q('k13','enzyme','3가지','효소 활성에 영향을 주는 요인을 3가지 쓰고 각각의 작용을 짧게 설명하시오.','온도: 저온에서는 분자 운동 감소, 고온에서는 변성. pH: 적정 범위에서 구조와 활성이 유지. 기질 농도: 증가하면 속도가 커지다가 효소가 포화되면 일정해짐.',[['온도','온도'],['pH','pH','산성도'],['기질 농도','기질농도']], '교과서 70–71쪽');
Q('k14','resp-intro','3가지','ATP를 합성하는 인산화 방식 3가지를 쓰고 원리를 구별하시오.','기질수준 인산화: 기질의 인산기를 ADP에 직접 전달. 산화적 인산화: 호흡 전자 전달계가 만든 H⁺ 기울기와 화학 삼투 이용. 광인산화: 빛에 의해 시작되는 전자 전달과 화학 삼투 이용.',[['기질수준','기질수준'],['산화적','산화적'],['광인산화','광인산화']], '교과서 88·92·113쪽','세 이름에 더해 에너지원과 원리도 각각 연결하세요.');
Q('k15','glycolysis','기본','포도당 1분자당 해당의 장소·ATP 소비와 생성·최종 산물을 쓰시오.','세포질에서 일어나며 ATP 2개를 소비하고 4개를 생성하여 순생성은 2 ATP다. 피루브산 2개와 NADH 2개가 생기며 CO₂는 발생하지 않는다.',[['세포질','세포질'],['2개 투자','2','두'],['4개 생성','4','네'],['피루브산','피루브산'],['NADH','NADH']], '교과서 88–89쪽','2와 4의 역할, 피루브산·NADH 각각 2개를 확인하세요.');
Q('k16','tca','기본','피루브산 1분자가 아세틸 CoA가 될 때의 장소와 산물을 쓰시오.','미토콘드리아 바탕질에서 탈탄산으로 CO₂ 1개가 나오고 NADH 1개와 아세틸 CoA 1개가 만들어진다. ATP는 직접 생성되지 않는다.',[['바탕질','바탕질','기질'],['CO₂','CO2','이산화탄소'],['NADH','NADH'],['아세틸 CoA','아세틸CoA','아세틸조효소A']], '교과서 90–91쪽');
Q('k17','tca','기본','TCA 회로 한 바퀴의 탄소 수 변화와 생성물을 쓰시오.','아세틸 CoA의 2C+옥살아세트산 4C → 시트르산 6C → 5C → 4C, 옥살아세트산 재생. 1회당 2 CO₂, 3 NADH, 1 FADH₂, 1 ATP 상당량 생성.',[['옥살아세트산','옥살아세트산'],['시트르산','시트르산','구연산'],['3 NADH','3NADH','NADH3','NADH는3'],['FADH₂','FADH2'],['CO₂','CO2','이산화탄소']], '교과서 90–91쪽','포도당 하나 기준은 한 바퀴의 두 배입니다.');
Q('k18','etc','융합','산소가 없으면 피루브산 산화·TCA 회로가 지속되기 어려운 이유를 쓰시오.','O₂는 전자 전달계의 최종 전자 수용체이다. 산소가 없으면 전자 전달과 NADH의 재산화가 막혀 NAD⁺가 부족해지므로 탈수소 반응이 지속되기 어렵다.',[['최종 전자 수용체','최종전자수용체','최종수용체'],['NADH','NADH'],['NAD⁺','NAD+'],['재산화/재생','재산화','재생','부족']], '교과서 90·92·96쪽');
Q('k19','etc','융합','산화적 인산화를 전자 이동 → H⁺ 이동 → ATP 합성 순서로 설명하시오.','NADH·FADH₂의 전자가 내막의 전자 전달계를 거쳐 O₂로 전달된다. 방출 에너지로 H⁺를 바탕질에서 막 사이 공간으로 옮긴다. H⁺가 ATP 합성 효소를 통해 바탕질로 돌아올 때 화학 삼투로 ATP가 합성된다.',[['전자 전달계','전자전달계'],['막 사이 공간','막사이공간','막간공간'],['바탕질','바탕질','기질'],['ATP 합성 효소','ATP합성효소'],['화학 삼투','화학삼투']], '교과서 92쪽','펌핑 방향과 ATP 합성 시 귀환 방향은 반대입니다.');
Q('k20','etc','계산','교과서 모형에서 포도당 1분자의 최대 ATP 수율을 계산하시오. NADH=2.5, FADH₂=1.5 ATP로 계산한다.','해당 순 2 ATP + TCA 2 ATP + 10 NADH×2.5 + 2 FADH₂×1.5 = 4+25+3=32 ATP. 산화적 인산화만은 28 ATP이다.',[['NADH 10개','10'],['FADH₂ 2개','2'],['산화적 28','28','25+3'],['총 32','32']], '교과서 93쪽','친구 요약본의 30~32 설명과 구분하여 이 문제는 최대 32 기준으로 풉니다.');
Q('k21','tca','기출형','기출 계산 모형: 시트르산 3분자가 옥살아세트산까지 전환될 때 얻는 ATP를 계산하시오. NADH=2.5, FADH₂=1.5이며 추가 탄소원은 없다.','시트르산 1개당 3 NADH·1 FADH₂·1 ATP → 7.5+1.5+1=10 ATP. 3개이므로 30 ATP이다. 생성된 옥살아세트산은 추가 아세틸 CoA가 없으므로 계속 회전한다고 계산하지 않는다.',[['NADH','NADH'],['FADH₂','FADH2'],['30 ATP','30']], '기출 7번 · 교과서 90–93쪽');
Q('k22','tca','기출형','기출 계산 모형: 피루브산 1분자의 완전 산화 수율과, 추가 탄소원 없이 옥살아세트산 1분자만 넣은 경우를 비교하시오.','피루브산 1개는 연결 반응+TCA에서 4 NADH·1 FADH₂·1 ATP를 만들어 10+1.5+1=12.5 ATP다. 옥살아세트산만 있고 아세틸 CoA 등 다른 탄소 공급원이 없다면 TCA 유입이 진행되지 않아 이 모형에서는 0 ATP다.',[['피루브산 12.5','12.5'],['옥살아세트산 0','0'],['아세틸 CoA','아세틸CoA','아세틸조효소A']], '기출 7번 · 교과서 90–93쪽','피루브산 산화는 회로의 촉매량 중간체가 있는 교과 계산을 전제합니다.');
Q('k23','fermentation','3가지','젖산 발효와 알코올 발효의 공통점을 장소·NAD⁺·ATP의 세 기준으로 쓰시오.','둘 다 세포질에서 일어나며 NADH를 산화하여 NAD⁺를 재생하고, 해당의 기질수준 인산화로 포도당당 순 2 ATP를 얻도록 한다.',[['세포질','세포질'],['NAD⁺ 재생','NAD+'],['기질수준 인산화','기질수준']], '교과서 96–99쪽','발효의 환원 단계가 2 ATP를 직접 합성한다고 쓰지 않았는지 확인하세요.');
Q('k24','fermentation','기출형','끓인 효모에서 기체가 나오지 않은 이유와, 알코올 용액을 밀봉하지 않았을 때 식초가 생기는 이유를 쓰시오.','가열로 효소 단백질이 변성되어 발효 반응이 진행되기 어렵다. 공기 중 산소를 이용하는 아세트산균이 에탄올을 산화하여 아세트산을 만들 수 있다.',[['변성','변성'],['산소','산소','O2'],['아세트산균','아세트산균','초산균'],['산화','산화']], '기출 8번 유형 · 교과서 71·96–99쪽');
Q('k25','pigment','기본','광합성 색소가 크로마토그래피로 분리되는 원인과 이동 순서를 쓰시오.','전개액에 대한 용해도와 종이에 대한 흡착력이 다르기 때문이다. 교과의 전개 조건에서 먼 쪽부터 카로틴 → 잔토필 → 엽록소 a → 엽록소 b 순이다.',[['용해도','용해도'],['흡착력','흡착'],['카로틴','카로틴'],['잔토필','잔토필']], '교과서 108–109쪽','색소 4개의 순서를 직접 비교하세요. 전개액 조건이 달라지면 달라질 수 있습니다.');
Q('k26','light','3가지','비순환적 전자 흐름에서 생성되는 물질 3가지와 전자의 출발·도착점을 쓰시오.','생성물은 ATP·NADPH·O₂. 전자는 물에서 나와 광계 II와 광계 I을 거쳐 최종적으로 NADP⁺에 전달된다.',[['ATP','ATP'],['NADPH','NADPH'],['산소','O2','산소'],['물','물','H2O'],['NADP⁺','NADP+']], '교과서 112–113쪽');
Q('k27','light','3가지','순환적 전자 흐름과 비순환적 전자 흐름의 차이를 광계·전자 경로·산물로 쓰시오.','순환적 흐름은 광계 I을 사용하고 전자가 광계 I으로 돌아와 ATP 생성에 기여한다. 비순환적 흐름은 광계 II와 I을 사용하고 물에서 NADP⁺로 전자가 이동하며 ATP·NADPH·O₂가 생긴다.',[['광계 I','광계I','광계1','광계Ⅰ'],['광계 II','광계II','광계2','광계Ⅱ'],['되돌아옴','돌아','순환'],['NADPH','NADPH'],['산소','산소','O2']], '교과서 112–113쪽','순환 경로 자체가 NADPH·산소를 만든다고 쓰지 않았는지 확인하세요.');
Q('k28','calvin','3가지','캘빈 회로의 세 단계를 쓰고 ATP와 NADPH의 사용 단계를 설명하시오.','탄소 고정 → 3PG 환원 → RuBP 재생. ATP는 환원과 재생에, NADPH는 3PG 환원에 쓰인다.',[['탄소 고정','탄소고정'],['환원','환원'],['RuBP 재생','RuBP','리불로스'],['ATP','ATP'],['NADPH','NADPH']], '교과서 114–115쪽');
Q('k29','calvin','계산','3 CO₂를 고정하여 PGAL 1개를 순생성할 때 ATP·NADPH 소비량과 PGAL의 분배를 쓰시오.','6 ATP·6 NADPH로 6 PGAL을 만든 뒤 1개는 빠져나가고, 5개가 3 ATP를 써 3 RuBP로 재생된다. 총 9 ATP·6 NADPH를 소비한다.',[['9 ATP','9ATP','ATP9','ATP는9'],['6 NADPH','6NADPH','NADPH6','NADPH는6'],['PGAL 5개 재생','5','다섯'],['RuBP','RuBP']], '교과서 115쪽');
Q('k30','calvin','융합','빛을 유지하면서 CO₂ 공급을 중단한 직후 3PG와 RuBP의 변화를 원인과 함께 쓰시오.','탄소 고정이 중단되어 RuBP 소비와 3PG 생성이 줄고, 환원·재생은 잠시 계속되므로 3PG는 감소하고 RuBP는 증가한다.',[['탄소 고정','탄소고정'],['3PG','3PG'],['RuBP','RuBP'],['재생','재생']], '교과서 115·127쪽','정답 방향: 3PG 감소 / RuBP 증가. 키워드만 맞아도 방향을 확인하세요.');
Q('k31','calvin','융합','CO₂를 유지하면서 빛을 끈 직후 3PG와 RuBP의 변화를 쓰시오.','명반응의 ATP·NADPH 공급이 줄어 3PG 환원과 RuBP 재생이 제한되므로 3PG가 증가하고 RuBP가 감소한다.',[['ATP','ATP'],['NADPH','NADPH'],['3PG','3PG'],['RuBP','RuBP']], '교과서 111·115쪽 · 수업 필기','정답 방향: 3PG 증가 / RuBP 감소. 변화 직후의 교과 모형입니다.');
Q('k32','compare','3가지','세포호흡과 광합성의 ATP 합성 원리의 공통점을 3가지 쓰시오.','① 전자 전달계에서 연속적인 산화 환원이 일어난다. ② 에너지로 막 양쪽 H⁺ 기울기를 형성한다. ③ H⁺가 ATP 합성 효소를 통해 이동하는 화학 삼투로 ATP를 만든다.',[['전자 전달·산화 환원','전자전달','산화환원'],['H⁺ 기울기','기울기','농도차'],['ATP 합성 효소','ATP합성효소']], '교과서 116–117쪽');
Q('k33','compare','융합','미토콘드리아와 엽록체에서 H⁺ 축적 공간과 ATP 합성 시 H⁺ 이동 방향을 비교하시오.','미토콘드리아: 막 사이 공간에 축적, 막 사이 공간 → 바탕질. 엽록체: 틸라코이드 내부에 축적, 틸라코이드 내부 → 스트로마. 모두 ATP 합성 효소를 통해 기울기를 따라 이동한다.',[['막 사이 공간','막사이공간','막간공간'],['바탕질','바탕질','기질'],['틸라코이드 내부','틸라코이드내부','틸라코이드안'],['스트로마','스트로마']], '교과서 116–117쪽','두 방향을 뒤집지 않았는지 확인하세요.');
Q('k34','compare','융합','내막이 H⁺를 자유롭게 통과시키는 조건에서 ATP 합성이 감소하는 이유를 막의 성질과 연결하시오.','정상 인지질층은 H⁺가 쉽게 통과하지 못해 기울기를 유지한다. H⁺가 ATP 합성 효소를 거치지 않고 새면 기울기가 소실되어 화학 삼투에 의한 ATP 합성이 감소한다.',[['인지질/막','인지질','막'],['기울기','기울기','농도차'],['ATP 합성 효소','ATP합성효소'],['화학 삼투','화학삼투']], '교과서 38–40·92·113쪽에서 만든 융합 연습');
Q('k35','history','기본','교과서 효소 연구사의 다섯 인물과 핵심 업적을 쓰시오.','스팔란차니—위액 소화, 슈반—펩신 발견, 섬너—유레이스 결정화, 노스럽—펩신·트립신 등 결정화, 필립스—라이소자임 입체 구조 규명.',[['스팔란차니','스팔란차니','스팔란차니'],['슈반','슈반'],['섬너','섬너'],['노스럽','노스럽'],['필립스','필립스']], '교과서 77쪽','친구 자료의 예시 목록 대신 교과서 명단입니다. 업적의 짝도 확인하세요.');
Q('k36','history','융합','루벤과 캘빈의 표지 실험을 동위 원소·추적 대상·결론으로 비교하시오.','루벤은 ¹⁸O로 물을 표지하여 방출 O₂가 물에서 유래함을 확인했다. 캘빈은 ¹⁴CO₂로 탄소를 표지하고 크로마토그래피·자기 방사법으로 3PG와 탄소 고정 경로를 추적했다.',[['¹⁸O','18O'],['물','물','H2O'],['¹⁴C','14C'],['3PG','3PG'],['자기 방사법','자기방사']], '교과서 114·120–121쪽');
Q('k37','history','융합','야겐도르프 실험의 암실·pH 4→8·ADP와 Pi 조건이 의미하는 바를 쓰시오.','틸라코이드 내부를 pH 4로 만든 뒤 바깥을 pH 8로 바꾸면 내부 H⁺가 ATP 합성 효소를 통해 밖으로 흐른다. ADP와 Pi로 일시적으로 ATP가 합성되어 H⁺ 기울기가 ATP 합성의 직접 원인임을 보인다.',[['H⁺ 기울기','기울기','농도차'],['ATP 합성 효소','ATP합성효소'],['ADP','ADP'],['Pi','Pi','무기인산'],['일시적','일시','잠시']], '교과서 121쪽','암실에서도 가능하다는 것은 지속적으로 빛 없이 광합성을 할 수 있다는 뜻이 아닙니다.');
Q('k38','history','기본','엥겔만의 실험에서 호기성 세균이 모인 위치와 그 까닭을 쓰시오.','청자색광·적색광 부근에서 광합성이 활발해 산소가 많이 발생하므로 산소를 필요로 하는 호기성 세균이 많이 모인다.',[['청자색/청색','청자색','청색'],['적색','적색','빨간'],['산소','산소','O2']], '교과서 120쪽');
Q('k39','fermentation','융합','포도당은 있지만 ATP가 0인 무산소 효모 효소액에서 발효가 시작되지 않는 이유를 쓰시오.','해당 초기에 포도당을 인산화하려면 ATP 투자가 필요하다. 시작 ATP가 없으면 이 단계를 진행하지 못한다. 과당 2인산은 이 투자 단계를 우회하여 이후 ATP를 만들 수 있다.',[['해당','해당'],['초기 투자','투자','초기'],['인산화','인산화']], '교과서 127쪽 12–13번 유형');
Q('k40','energy','3가지','광합성과 세포호흡이 단순한 역반응 관계가 아닌 이유를 3가지 쓰시오.','사용하는 효소와 중간체가 다르고, 반응 장소와 전자 전달계가 다르며, 광합성은 빛에너지를 저장하고 호흡은 유기물 에너지를 ATP로 옮기고 일부를 열로 방출한다.',[['효소/중간체','효소','중간체'],['장소/전자 전달계','장소','전자전달계'],['에너지','에너지']], '교과서 61·110·116–117쪽');
Q('k41','cell','3가지','원핵세포와 진핵세포의 차이를 핵막·막성 소기관·DNA로 비교하시오.','원핵세포는 핵막과 막성 소기관이 없고 DNA가 세포질의 핵양체에 있다. 진핵세포는 핵막으로 둘러싸인 핵과 막성 소기관을 가지며 핵 안에 DNA가 있다.',[['핵막','핵막'],['막성 소기관','막성소기관'],['DNA','DNA']], '교과서 36–37쪽');
Q('k42','enzyme','3가지','효소의 특징을 활성화 에너지·특이성·재사용의 세 기준으로 쓰시오.','활성화 에너지를 낮추어 반응을 빠르게 하고, 활성 부위에 맞는 특정 기질에 작용하며, 반응 후 소모되지 않아 다시 사용된다.',[['활성화 에너지','활성화에너지'],['기질 특이성','특이성','특정기질'],['재사용','재사용','다시사용','소모되지']], '교과서 67–68쪽');
Q('k43','pigment','기본','흡수 스펙트럼과 작용 스펙트럼의 차이를 쓰시오.','흡수 스펙트럼은 파장별 빛의 흡수 정도를, 작용 스펙트럼은 파장별 광합성 효과나 속도를 나타낸다.',[['파장','파장'],['흡수','흡수'],['광합성 효과/속도','광합성효과','광합성속도','광합성량']], '교과서 107쪽');
Q('k44','history','기본','힐과 벤슨의 실험이 명반응·탄소 고정반응의 관계를 어떻게 보여 주는지 쓰시오.','힐은 빛과 적절한 전자 수용체가 있으면 CO₂ 고정 없이도 분리 엽록체에서 산소가 발생함을 보였다. 벤슨은 빛 단계에서 만들어진 ATP·NADPH가 이후 탄소 고정에 필요하여 두 단계가 연결됨을 보여 준다.',[['전자 수용체','전자수용체'],['산소','산소','O2'],['ATP','ATP'],['NADPH','NADPH']], '교과서 111·120쪽');

Q('k45','experiments','3가지','기질 종류에 따른 효모 발효 실험의 조작·종속·통제 변인을 쓰시오.','조작 변인은 기질 종류, 종속 변인은 일정 시간 동안 발생한 CO₂ 양이다. 효모량·온도·용액 부피·시간 등을 통제한다.',[['기질 종류','기질종류','기질의종류'],['CO₂ 발생량','CO2','이산화탄소'],['통제 조건','온도','효모량','부피','시간']], '교과서 100–101쪽','세 변인에 이름과 예시를 각각 대응시키세요.');
Q('k46','cell','기출형','미세 소관과 미세 섬유의 기능을 비교하고, 섬모·편모 단면과 연결하시오.','미세 소관은 세포 내 수송 경로, 방추사, 섬모·편모의 구성 등에 관여한다. 미세 섬유는 액틴으로 이루어져 세포 운동과 수축 등에 관여한다. 전형적인 진핵 섬모·편모의 단면에는 미세 소관이 배열되어 있다.',[['미세 소관','미세소관'],['수송·방추사','수송','방추사'],['미세 섬유','미세섬유'],['운동·수축','운동','수축']], '교과서 33쪽 · 기출 3번 유형');

function home(){const done=Object.values(state.lessons).filter(Boolean).length;const trained=Object.keys(state.answers).length;return title('YOUR STUDY DESK','조금씩 이해하고, 확실하게 기억하기','교과서의 흐름을 잡고, 핵심 키워드로 답하는 이틀의 공부.',`<label class="date-control">시험일 <input type="date" id="examDate" value="${esc(state.date)}" aria-label="시험 날짜"></label>`)+`<section class="hero"><div class="hero-copy"><span class="pill">✦ 세포호흡 · 광합성, 여기서 시작</span><h2>복잡한 과정도<br>한 단계씩 보면 이해돼요.</h2><p>어디에서, 무엇이 들어오고, 무엇이 나올까?<br>그림을 따라가며 에너지의 흐름부터 잡아 보세요.</p><a class="btn" href="#lab/resp">세포호흡부터 이해하기 <span>→</span></a></div><div class="hero-art">${heroArt}</div></section><div class="stats"><div class="stat"><span class="stat-icon">▦</span><div><strong>${done}<small>/ ${LESSONS.length}</small></strong><label>스스로 설명한 개념</label></div></div><div class="stat"><span class="stat-icon">✎</span><div><strong>${trained}<small>/ ${QUESTIONS.length}</small></strong><label>확인한 연습문항</label></div></div><a class="stat" href="#review"><span class="stat-icon">↻</span><div><strong>${reviewItems().length}<small>문항</small></strong><label>한 번 더 꺼내 쓸 내용</label></div></a></div><div class="home-grid"><section><div class="section-heading"><h2>이틀의 공부 순서</h2><span class="mini-label">완료한 공부에 체크</span></div><div class="panel"><div class="plan-tabs">${['오늘','내일','시험 당일'].map((x,i)=>`<button data-day="${i}" class="${i===planDay?'active':''}">${x}</button>`).join('')}</div><div id="planContent">${planHtml()}</div></div></section><section><div class="section-heading"><h2>선생님 스타일로 연습</h2><a class="text-link" href="#quiz">전체 보기 ↗</a></div><div class="panel focus-card"><div class="eyebrow">KEYWORD PRACTICE</div><h3>“공통점 3가지를<br>쓰시오.”</h3><p>긴 문장보다 핵심어부터 떠올리세요.<br>답을 쓰고, 빠진 키워드를 확인해요.</p><div class="keyword-chips">${chips(['전자 전달계','H⁺ 기울기','ATP 합성 효소'])}</div><a class="btn secondary" href="#quiz/q/k32">3가지 쓰기 연습하기 →</a></div></section></div><div class="section-heading"><h2>지금 필요한 개념으로 바로 가기</h2><a class="text-link" href="#concepts">교과서 개념 지도 function planHtml(){const p=PLAN[planDay];return `<div class="summary-bar"><strong>${p.day}</strong><span>${p.subtitle}</span></div>${p.items.map(x=>`<div class="plan-item"><input type="checkbox" id="${x[0]}" data-plan="${x[0]}" aria-label="${x[1]} 완료" ${state.plan[x[0]]?'checked':''}><a href="#${x[3]}${x[4]?'/'+encodeURIComponent(x[4]):''}"><strong>${x[1]}</strong><p>${x[2]}</p></a><span class="arrow">↗</span></div>`).join('')}`;}
function courseCard(l,i){return `<a class="course-card" href="#lesson/${l.id}"><div class="course-top"><span>${String(LESSONS.indexOf(l)+1).padStart(2,'0')} / ${l.group}</span><span class="${state.lessons[l.id]?'complete-dot':''}">${state.lessons[l.id]?'✓ 설명 가능':'↗'}</span></div><h3>${l.title}</h3><p>${l.lead}</p><div class="course-bottom"><span>교과서 ${l.pages}쪽</span><span>약 ${l.time}분</span></div></a>`;}
function concepts(){return title('CONCEPT MAP','교과서 개념 지도','기초부터 연결까지. 읽고 난 뒤, 책을 덮고 한 문장으로 설명해 보세요.')+`<div class="search-row"><input id="conceptSearch" class="search" type="search" placeholder="개념이나 키워드 검색 · 예: NADH, 삼투, 골지체" aria-label="개념 검색" value="${esc(conceptSearch)}"><select id="conceptGroup" aria-label="단원 선택">${['전체',...new Set(LESSONS.map(x=>x.group))].map(x=>`<option ${x===conceptGroup?'selected':''}>${x}</option>`).join('')}</select></div><div id="conceptResults">${conceptResults()}</div>`;}
function conceptResults(){let list=LESSONS.filter(l=>(conceptGroup==='전체'||l.group===conceptGroup)&&JSON.stringify(l).toLowerCase().includes(conceptSearch.toLowerCase()));return `<div class="summary-bar">${list.length}개 개념 <span>추천 순서: ATP 기초 → 세포호흡 → 광합성 → 나머지 단원</span></div><div class="course-grid">${list.map(courseCard).join('')}</div>${list.length?'':'<div class="empty"><p>검색어에 해당하는 개념이 없어요. 짧은 용어로 다시 찾아보세요.</p></div>'}`;}
function lesson(id){const l=lessonBy(id);if(!l)return emptyPage('개념을 찾을 수 없어요.','#concepts');const next=LESSONS[LESSONS.indexOf(l)+1];return `<a class="back-link" href="#concepts">← 개념 지도로</a>`+title(l.group,l.title,l.lead)+`<div class="keyword-chips">${chips(l.keys)}</div><div class="lesson-layout"><div class="lesson-cards">${l.cards.map((c,i)=>`<article class="lesson-card"><div class="number">KEY IDEA ${String(i+1).padStart(2,'0')}</div><h3>${c[0]}</h3><p>${c[1]}</p></article>`).join('')}<div class="callout"><h3>책을 덮고, 나에게 설명하기</h3><p>${l.recall}</p></div><div class="lesson-next"><button class="btn" id="completeLesson" data-id="${l.id}">${state.lessons[l.id]?'✓ 설명 가능 표시 취소':'스스로 설명했어요 ✓'}</button>${next?`<a class="btn secondary" href="#lesson/${next.id}">다음 개념 →</a>`:''}</div></div><aside class="lesson-side"><div class="panel"><h3>이 개념의 핵심어</h3><div class="keyword-chips">${chips(l.keys)}</div><p>단어를 기억했다면<br>이유와 방향까지 이어 보세요.</p><a class="btn" href="#quiz/topic/${l.id}">연결 문제 풀기 →</a>${['resp-intro','glycolysis','tca','etc','light','calvin','compare','enzyme','osmosis'].includes(id)?`<a class="btn secondary" href="#lab/${['light','calvin'].includes(id)?'photo':id==='enzyme'?'enzyme':id==='osmosis'?'osmosis':id==='compare'?'gradient':'resp'}">과정 실험실 열기</a>`:''}<div class="source-ref">교과서 인쇄 ${l.pages}쪽<br>첨부 PDF ${l.pdf}페이지<br>설명은 학습용으로 재구성했습니다.</div></div></aside></div>`;}

{name:'해당',place:'세포질',head:'포도당을 두 조각으로 나누기',desc:'처음에 ATP 2개를 투자하고, 두 3탄소 물질을 산화하면서 ATP 4개를 회수해요. NAD⁺는 전자를 받아 NADH가 됩니다. 이 단계의 순이익은 2 ATP예요.',out:['순 2 ATP','2 NADH','CO₂ 발생 없음'],left:['포도당','6탄소 × 1',6],right:['피루브산','3탄소 × 2',3],tip:'산소를 직접 쓰지 않습니다. 하지만 계속하려면 NAD⁺를 재생해야 합니다.',ref:'88–89'},

function tcaSvg(){return `<svg viewBox="0 0 440 270" role="img" aria-label="아세틸 CoA의 2탄소가 4탄소 옥살아세트산과 결합, 6탄소 시트르산에서 5탄소와 4탄소를 거쳐 옥살아세트산 재생"><path d="M130 65 C270 20 372 128 277 221 C199 282 77 210 98 124" stroke="#adc382" stroke-width="22" fill="none"/><path d="M97 96l-18 31h38" fill="#759754"/><g fill="#f8fbf1" stroke="#bfcea4"><rect x="54" y="44" width="123" height="47" rx="9"/><rect x="265" y="67" width="120" height="47" rx="9"/><rect x="270" y="182" width="110" height="47" rx="9"/><rect x="49" y="175" width="114" height="47" rx="9"/></g><g fill="#4e6d3b" text-anchor="middle" font-size="12"><text x="115" y="64">옥살아세트산</text><text x="115" y="81">4C</text><text x="325" y="88">시트르산 6C</text><text x="325" y="210">5C 화합물</text><text x="106" y="203">4C 화합물</text><text x="217" y="140" font-size="19" font-weight="bold">TCA</text><text x="218" y="161" font-size="10">1회전 → 다시 4C</text></g><g fill="#a2814b" font-size="11"><text x="197" y="25">+ 아세틸기 2C</text><text x="357" y="153">CO₂ ↓</text><text x="188" y="257">CO₂ ↓</text></g></svg>`;}
function gradientSvg(mode,active=true,blocked=false,leak=false){const mito=mode==='mito';let high=active&&!leak;let atp=high&&!blocked;const outside=mito?'막 사이 공간':'틸라코이드 내부',inside=mito?'바탕질(기질)':'스트로마';return `<svg viewBox="0 0 540 290" role="img" aria-label="${outside}에 H+ 축적, ATP 합성 효소를 통해 ${inside}로 이동"><defs><marker id="ga" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#719b52"/></marker></defs><rect x="15" y="15" width="510" height="260" rx="24" fill="#f7faed" stroke="#c6d4ac"/><rect x="15" y="124" width="510" height="38" fill="#b7cf90"/><path d="M18 131h504M18 155h504" stroke="#8dab61" stroke-width="3" stroke-dasharray="3 6"/><text x="32" y="42" fill="#829963" font-size="13">${outside}</text><text x="32" y="254" fill="#829963" font-size="13">${inside}</text>${Array.from({length:high?11:4},(_,i)=>`<text x="${36+i*42}" y="${72+(i%2)*29}" fill="#8a9a5f" font-size="13">H⁺</text>`).join('')}${Array.from({length:high?2:4},(_,i)=>`<text x="${48+i*57}" y="218" fill="#aab697" font-size="12">H⁺</text>`).join('')}<rect x="161" y="111" width="64" height="65" rx="12" fill="#8fae71"/><text x="193" y="138" text-anchor="middle" fill="white" font-size="11">전자</text><text x="193" y="154" text-anchor="middle" fill="white" font-size="11">전달계</text><path d="M244 199V78" stroke="${active?'#719b52':'#b7c3a4'}" stroke-width="4" marker-end="url(#ga)" ${!active?'stroke-dasharray="5 5"':''}/><rect x="361" y="109" width="42" height="63" rx="12" fill="${blocked?'#c9b194':'#b2a66b'}"/><ellipse cx="382" cy="184" rx="41" ry="20" fill="${blocked?'#c9b194':'#c4b97d'}"/><text x="382" y="188" text-anchor="middle" fill="white" font-size="10">ATP 합성 효소</text><path d="M430 77V204" stroke="${atp?'#719b52':'#b7c3a4'}" stroke-width="4" marker-end="url(#ga)" ${!atp?'stroke-dasharray="5 5"':''}/><text x="340" y="235" fill="#a98d4b" font-size="13">ADP + Pi ${atp?'→ ATP':'… ATP 감소'}</text>${leak?'<path d="M90 98v94" stroke="#bd8664" stroke-width="4" stroke-dasharray="5 4"/><text x="43" y="185" fill="#bd8664" font-size="11">H⁺ 누출</text>':''}${blocked?'<text x="376" y="151" fill="#865e42" font-size="24">×</text>':''}</svg>`;}
function photoSvg(){return `<svg viewBox="0 0 460 265" role="img" aria-label="물에서 광계 II와 I을 거쳐 NADP+로 비순환적 전자 전달"><g fill="#f7faef" stroke="#bacba0"><rect x="15" y="153" width="78" height="48" rx="10"/><rect x="111" y="71" width="85" height="49" rx="10"/><rect x="244" y="71" width="85" height="49" rx="10"/><rect x="360" y="154" width="85" height="48" rx="10"/></g><g font-size="12" text-anchor="middle" fill="#4f6b3e"><text x="54" y="183">H₂O</text><text x="153" y="93">광계 II</text><text x="153" y="110" font-size="10">P680</text><text x="287" y="93">광계 I</text><text x="287" y="110" font-size="10">P700</text><text x="403" y="183">NADP⁺</text></g><path d="M61 148L110 116M199 117L220 152L245 119M329 120L368 151" stroke="#7f9c5a" fill="none" stroke-width="3"/><g fill="#ad9753" font-size="12"><text x="143" y="48">☀ 빛</text><text x="274" y="48">☀ 빛</text><text x="11" y="231">O₂ 발생</text><text x="184" y="184">H⁺ 기울기</text><text x="197" y="205">↓ ATP</text><text x="360" y="232">↓ NADPH</text></g><text x="203" y="148" font-size="10" fill="#799466">전자 전달계</text></svg>`;}
function lab(mode){labMode=['resp','photo','gradient','enzyme','osmosis'].includes(mode)?mode:'resp';return title('PROCESS LAB','과정 실험실','단계를 눌러 흐름을 따라가고, 조건을 바꾸며 이유를 설명해 보세요.')+`<div class="tabs" role="tablist" aria-label="실험실 선택">${[['resp','세포호흡'],['photo','광합성'],['gradient','H⁺ 기울기 비교'],['enzyme','효소 그래프'],['osmosis','삼투 그래프']].map(([id,n])=>`<button role="tab" aria-selected="${id===labMode}" data-lab="${id}" class="${id===labMode?'active':''}">${n}</button>`).join('')}</div><div class="lab-wrap" id="labBody">${labBody()}</div>`;}
function labBody(){if(labMode==='gradient')return gradientLab();if(labMode==='enzyme')return enzymeLab();if(labMode==='osmosis')return osmosisLab();const arr=labMode==='resp'?RESP:PHOTO;labStep=Math.min(labStep,arr.length-1);const s=arr[labStep];let diagram=labMode==='resp'?(labStep===2?tcaSvg():labStep===3?gradientSvg('mito'):molecules(s.left,s.right)):(labStep===0?photoSvg():molecules(s.left,s.right));return `<div class="steps">${arr.map((x,i)=>`<button data-step="${i}" class="${i===labStep?'active':''}" aria-pressed="${i===labStep}"><b>STEP 0${i+1}</b>${x.name}</button>`).join('')}</div><div class="lab-main"><section class="diagram-panel"><h3>${labMode==='resp'?'포도당 1분자 기준':'명반응 → 3 CO₂ 기준 캘빈 회로'}</h3>${diagram}<div class="outputs">${s.out.map(x=>`<span>${x}</span>`).join('')}</div></section><article class="panel lab-explain"><span class="place-tag">⌖ ${s.place}</span><h2>${s.head}</h2><p>${s.desc}</p><div class="notice" style="margin-top:18px">${s.tip}</div><div class="lab-controls"><button class="btn secondary small" data-step="${labStep-1}" ${labStep===0?'disabled':''}>← 이전</button><button class="btn small" data-step="${labStep+1}" ${labStep===3?'disabled':''}>다음 단계 →</button></div><div class="source-ref">교과서 ${s.ref}쪽 · 흐름을 단순화한 학습 그림</div></article></div>${labMode==='resp'?respTable():calvinConditions()}<div class="section-heading"><h2>이해한 흐름을 답안으로</h2><a class="btn secondary small" href="#quiz/topic/${labMode==='resp'?'etc':'calvin'}">핵심어로 써 보기 →</a></div>`;}
function respTable(){return `<div class="section-heading"><h2>한눈에 보는 에너지 장부</h2><span class="mini-label">모두 포도당 1분자 기준</span></div><div class="table-wrap"><table><thead><tr><th>단계</th><th>CO₂</th><th>NADH</th><th>FADH₂</th><th>직접 ATP</th></tr></thead><tbody><tr><td>해당</td><td>0</td><td>2</td><td>0</td><td>순 2</td></tr><tr><td>피루브산 산화</td><td>2</td><td>2</td><td>0</td><td>0</td></tr><tr><td>TCA (2회전)</td><td>4</td><td>6</td><td>2</td><td>2</td></tr><tr><td><strong>합계</strong></td><td>6</td><td>10</td><td>2</td><td>4</td></tr></tbody></table></div><div class="notice" style="margin-top:12px">산화적 인산화: 10×2.5 + 2×1.5 = 28 ATP · 전체: 28+4 = <strong>최대 32 ATP</strong>. 실제 수율의 변동과 별개로 제공 교과서 93쪽의 모형을 적용합니다.</div>`;}
let calvinCondition='normal';function calvinConditions(){return `<div class="section-heading"><h2>조건을 바꾸면 어떻게 될까?</h2><span class="mini-label">변화 직후의 교과 모형</span></div><div class="control-box"><label>공급 조건 <select id="calvinCondition"><option value="normal" ${calvinCondition==='normal'?'selected':''}>빛 + CO₂ 공급</option><option value="dark" ${calvinCondition==='dark'?'selected':''}>빛 차단 · CO₂ 유지</option><option value="no-co2" ${calvinCondition==='no-co2'?'selected':''}>빛 유지 · CO₂ 차단</option></select></label></div><div class="notice" id="calvinResult" aria-live="polite">${calvinResult()}</div>`;}
function calvinResult(){return calvinCondition==='dark'?'<strong>3PG ↑ · RuBP ↓</strong><br>ATP·NADPH 공급 감소 → 3PG 환원과 RuBP 재생 제한. 남아 있는 물질로 탄소 고정이 잠시 이어져 3PG가 축적됩니다.':calvinCondition==='no-co2'?'<strong>3PG ↓ · RuBP ↑</strong><br>탄소 고정 중단 → RuBP 소비와 3PG 생성 감소. 환원·재생은 잠시 계속되어 RuBP가 늘어납니다.':'<strong>명반응과 캘빈 회로가 연결됩니다.</strong><br>명반응은 ATP·NADPH를 공급하고, 캘빈 회로는 이를 소비하여 ADP·Pi·NADP⁺를 돌려줍니다. 실제 농도는 생성·소비 속도에 따라 결정됩니다.';}
let grad={active:true,blocked:false,leak:false};function gradientLab(){return `<div class="control-box"><label><input type="checkbox" id="energyOn" ${grad.active?'checked':''}>전자 전달 유지</label><label><input type="checkbox" id="blockSynthase" ${grad.blocked?'checked':''}>ATP 합성 효소 차단</label><label><input type="checkbox" id="leakMembrane" ${grad.leak?'checked':''}>막의 H⁺ 누출</label></div><div id="gradientResult">${gradientResult()}</div><div class="panel" style="margin-top:20px"><h3>같은 원리, 다른 공간</h3><div class="compare-row"><b>기준</b><strong>세포호흡</strong><strong>광합성 비순환</strong></div>${[['전자 공급체','NADH · FADH₂','H₂O'],['최종 수용체','O₂','NADP⁺'],['H⁺ 축적','막 사이 공간','틸라코이드 내부'],['ATP 생성 쪽','바탕질','스트로마']].map(a=>`<div class="compare-row"><b>${a[0]}</b><span>${a[1]}</span><span>${a[2]}</span></div>`).join('')}<div class="source-ref">교과서 92·113·116–117쪽. 정성적 개념 모형이며 실제 농도·시간을 계산하는 시뮬레이션은 아닙니다.</div></div>`;}
function gradientResult(){let message=grad.leak?'H⁺가 막을 통해 새면 기울기가 유지되지 못합니다. ATP 합성 효소를 통한 에너지 회수가 줄어 ATP 합성이 감소합니다.':grad.blocked?'ATP 합성 효소를 막으면 H⁺의 귀환과 ATP 합성이 억제됩니다. 전자 전달이 계속되는 초기에는 기울기가 커질 수 있으나, 이후 역압력으로 전자 전달도 제한될 수 있습니다.':!grad.active?'새로운 H⁺ 펌핑이 멈춥니다. 기존 기울기로 ATP가 잠시 만들어질 수 있지만, 기울기가 소모된 뒤에는 지속적인 합성이 어렵습니다. 아래 그림은 기울기가 소모된 뒤를 표시합니다.':'전자 전달 에너지로 H⁺를 모으고, H⁺가 ATP 합성 효소를 통해 돌아오면서 ATP를 만듭니다. 두 소기관에서 공간의 이름을 바꿔 말해 보세요.';return `<div class="split-panels"><div class="diagram-panel"><h3>미토콘드리아 내막</h3>${gradientSvg('mito',grad.active,grad.blocked,grad.leak)}</div><div class="diagram-panel"><h3>엽록체 틸라코이드 막</h3>${gradientSvg('photo',grad.active,grad.blocked,grad.leak)}</div></div><div class="notice" style="margin-top:17px" aria-live="polite">${message}</div>`;}
let enzymeMode='normal',substrate=30;function enzymeLab(){return `<div class="control-box"><label>조건 <select id="enzymeMode"><option value="normal" ${enzymeMode==='normal'?'selected':''}>정상</option><option value="competitive" ${enzymeMode==='competitive'?'selected':''}>경쟁적 저해</option><option value="noncompetitive" ${enzymeMode==='noncompetitive'?'selected':''}>순수 비경쟁적 저해</option></select></label><label>기질 농도 <input id="substrate" type="range" min="0" max="100" value="${substrate}" aria-label="기질 농도"><output id="subValue">${substrate}</output></label></div><div id="enzymeResult">${enzymeResult()}</div>`;}
function enzymeResult(){const vmax=enzymeMode==='noncompetitive'?50:100,km=enzymeMode==='competitive'?40:10;const rate=vmax*substrate/(km+substrate);const path=(v,k)=>Array.from({length:101},(_,i)=>`${i?'L':'M'}${50+i*4.5},${265-v*i/(k+i)*2}`).join(' ');return `<div class="lab-main"><div class="diagram-panel"><svg viewBox="0 0 550 320" role="img" aria-label="정상과 선택한 조건의 기질 농도 대비 반응 속도 곡선"><path d="M50 35V265H515" stroke="#a3b28c" fill="none"/><path d="M50 65H500M50 165H500" stroke="#d2ddbf" stroke-dasharray="5 5"/><text x="15" y="70" font-size="11" fill="#7e9165">100</text><text x="23" y="169" font-size="11" fill="#7e9165">50</text><text x="27" y="269" font-size="11" fill="#7e9165">0</text><text x="45" y="19" font-size="11" fill="#6f8556">초기 반응 속도 (상대값)</text><text x="390" y="300" font-size="11" fill="#6f8556">기질 농도 (상대값)</text><path d="${path(100,10)}" fill="none" stroke="#c4d1ae" stroke-width="3"/><path d="${path(vmax,km)}" fill="none" stroke="#527d45" stroke-width="4"/><path d="M${50+substrate*4.5} 265V${265-rate*2}" stroke="#be9558" stroke-dasharray="4 4"/><circle cx="${50+substrate*4.5}" cy="${265-rate*2}" r="6" fill="#c69b62"/><text x="65" y="294" font-size="10" fill="#9baa86">연한 곡선: 정상 · 진한 곡선: 선택 조건</text></svg></div><div class="panel lab-explain"><span class="place-tag">교과서 70–71쪽 · 기출 5번 유형</span><h2>${enzymeMode==='normal'?'기질을 늘려도 한계가 있어요':enzymeMode==='competitive'?'기질이 경쟁에서 이길 수 있어요':'기질을 늘려도 최대 속도는 낮아요'}</h2><p>${enzymeMode==='normal'?'효소량이 일정하면 활성 부위의 수가 한정됩니다. 기질이 충분히 많아지면 활성 부위가 거의 점유되어 포화에 접근합니다.':enzymeMode==='competitive'?'활성 부위에서 기질과 경쟁합니다. 높은 기질 농도에서는 저해를 완화할 수 있어 Vmax는 일정하고 겉보기 Km은 증가합니다.':'기질 결합과 다른 부위에서 효소 기능을 낮추는 순수 비경쟁적 모형입니다. Vmax는 감소하고 Km은 일정합니다.'}</p><div class="keyword-chips">${chips(['Vmax '+vmax,'Km '+km,'현재 속도 '+rate.toFixed(1)])}</div><div class="notice">숫자는 원리를 보여 주는 임의의 상대값입니다. 곡선은 Vmax×[S]/(Km+[S])로 계산하며 실제 실험 측정치가 아닙니다.</div><a class="btn secondary small" href="#quiz/q/k12" style="margin-top:15px">그래프를 말로 설명하기 →</a></div></div>`;}
let cellVolume=55;function osmosisLab(){return `<div class="control-box"><label>세포 부피 <input id="cellVolume" type="range" min="0" max="100" value="${cellVolume}" aria-label="상대 세포 부피"><output id="volumeValue">${cellVolume}</output></label><span class="mini-label">0: 원형질 분리 쪽 · 20: 한계 원형질 분리 · 100: 완전 팽윤</span></div><div id="osmosisResult">${osmosisResult()}</div>`;}
function osmosisResult(){const u=cellVolume/100;const osm=12-4*u,press=Math.max(0,(u-.2)*10),suction=osm-press;const vals=x=>[12-4*x,Math.max(0,(x-.2)*10),12-4*x-Math.max(0,(x-.2)*10)];const path=j=>Array.from({length:101},(_,i)=>`${i?'L':'M'}${50+i*4.5},${270-vals(i/100)[j]*17}`).join(' ');return `<div class="lab-main"><div class="diagram-panel"><svg viewBox="0 0 550 325" role="img" aria-label="세포 부피가 증가할 때 삼투압은 감소하고 팽압은 증가하며 흡수력은 0에 접근하는 그래프"><path d="M50 35V270H515" stroke="#9baa83" fill="none"/><text x="40" y="20" font-size="11" fill="#84956c">압력 (상대값)</text><text x="378" y="302" font-size="11" fill="#84956c">세포의 상대 부피 →</text>${['#6b8b4e','#c29a60','#619492'].map((c,j)=>`<path d="${path(j)}" stroke="${c}" fill="none" stroke-width="3" ${j===2?'stroke-dasharray="5 4"':''}/>`).join('')}<path d="M${50+u*450} 40V270" stroke="#aab996" stroke-dasharray="4 5"/>${[osm,press,suction].map((v,i)=>`<circle cx="${50+u*450}" cy="${270-v*17}" r="5" fill="${['#6b8b4e','#c29a60','#619492'][i]}"/>`).join('')}<text x="65" y="314" font-size="10" fill="#6b8b4e">초록: 삼투압</text><text x="175" y="314" font-size="10" fill="#c29a60">갈색: 팽압</text><text x="270" y="314" font-size="10" fill="#619492">점선: 흡수력</text></svg></div><div class="panel lab-explain"><span class="place-tag">교과서 43쪽 · 기출 4번 유형</span><h2>흡수력 = 삼투압 − 팽압</h2><p>부피가 커지면 세포액이 묽어져 삼투압이 감소합니다. 원형질이 세포벽을 밀기 시작하면 팽압이 증가합니다. 두 곡선의 차이가 흡수력입니다.</p><div class="keyword-chips">${chips(['삼투압 '+osm.toFixed(1),'팽압 '+press.toFixed(1),'흡수력 '+suction.toFixed(1)])}</div><div class="notice">${cellVolume===100?'완전 팽윤: 삼투압=팽압, 흡수력=0. 삼투압 자체가 0인 것은 아닙니다.':cellVolume<=20?'원형질 분리~한계 원형질 분리 영역: 팽압=0이므로 흡수력=삼투압입니다.':'물이 순유입되고 팽압이 증가하는 구간입니다. 완전 팽윤에 가까워질수록 흡수력은 감소합니다.'}<br>실험값이 아닌 관계를 보여 주는 단순한 개형입니다.</div></div></div>`;}
function normalize(s){return String(s).normalize('NFKC').replace(/[⁺]/g,'+').replace(/[−–—]/g,'-').replace(/\s/g,'').toLowerCase();}
function termMatch(text,term){if(term.includes('&'))return term.split('&').every(part=>termMatch(text,part));const t=normalize(term);if(/^\d+(\.\d+)?$/.test(t))return new RegExp('(^|[^0-9.])'+t.replace('.','\\.')+'([^0-9.]|$)').test(text);return text.includes(t);}
function assess(q,answer){const s=normalize(answer);return q.criteria.map(c=>c.terms.some(t=>termMatch(s,t)));}
function currentDraft(q){return state.drafts[q.id]||'';}
function quiz(type='전체',topic='전체',qid=null){quizType=type;quizTopic=topic;quizPool=QUESTIONS.filter(q=>(type==='전체'||q.type===type)&&(topic==='전체'||q.topic===topic));if(qid){activeQuestion=questionBy(qid);quizType='전체';quizTopic='전체';quizPool=QUESTIONS;quizIndex=QUESTIONS.findIndex(q=>q.id===qid);}else{quizIndex=Math.min(Math.max(0,quizIndex),Math.max(0,quizPool.length-1));activeQuestion=quizPool[quizIndex];}return title('KEYWORD PRACTICE','핵심어로 꺼내 쓰는 연습','답안을 먼저 쓰고 핵심어를 확인하세요. 마지막으로 방향·수치·인과관계를 직접 점검해요.')+`<div class="filter-row">${['전체','3가지','기출형','융합','계산','기본'].map(x=>`<button data-qtype="${x}" class="${quizType===x?'active':''}">${x==='전체'?'전체 '+QUESTIONS.length+'문항':x}</button>`).join('')}</div><div class="search-row" style="margin-top:15px"><select id="quizTopic" aria-label="연습 단원"><option value="전체">전체 단원</option>${LESSONS.map(l=>`<option value="${l.id}" ${quizTopic===l.id?'selected':''}>${l.title}</option>`).join('')}</select><select id="questionPicker" aria-label="문항 선택">${quizPool.map((q,i)=>`<option value="${i}" ${i===quizIndex?'selected':''}>${i+1}. ${esc(q.title.length>46?q.title.slice(0,46)+'…':q.title)}</option>`).join('')}</select></div><div class="notice">자동 검사는 필수 용어의 포함 여부를 살펴보는 연습 도구입니다. 부정 표현·방향·수치의 연결·문장 의미를 완전히 판단하지 못하므로 실제 점수로 해석하지 마세요.</div><div id="quizArea">${questionHtml()}</div>`;}
function questionHtml(){const q=activeQuestion;if(!q)return `<div class="empty"><h3>이 조건의 준비된 문제가 없어요.</h3><p>다른 단원이나 전체 유형을 선택해 주세요. 탐구 설계는 개념 카드의 마지막 질문으로 복습할 수 있어요.</p><a class="btn secondary" href="#quiz">전체 문항 보기</a></div>`;const draft=currentDraft(q),parts=draft.split('\n\n');const a=state.answers[q.id];return `<div class="quiz-layout"><article class="panel question-card"><div class="question-top"><span class="chip">${q.type} · ${lessonBy(q.topic)?.group||'통합'}</span><span>${quizIndex+1} / ${quizPool.length}</span></div><h2>${q.title}</h2><label class="answer-label" for="answer0">${q.type==='3가지'?'항목을 나누어 핵심어 + 짧은 설명을 쓰세요.':'모범답안을 보지 않고 먼저 써 보세요.'}</label>${q.type==='3가지'?`<div class="triple">${[0,1,2].map(i=>`<label><span>0${i+1}</span><textarea class="answer-field" id="answer${i}" data-answer="${i}" placeholder="${i+1}번째 내용" aria-label="${i+1}번째 답안">${esc(parts[i]||'')}</textarea></label>`).join('')}</div>`:`<textarea class="answer-field" id="answer0" data-answer="0" placeholder="핵심 용어부터 떠올려 적어 보세요." aria-label="내 답안">${esc(draft)}</textarea>`}<div class="quiz-actions"><button class="btn" id="checkAnswer">핵심어 확인하기 <span>→</span></button><button class="btn secondary" id="showAnswer">모범답안만 보기</button><button class="btn soft" id="clearAnswer">다시 쓰기</button></div><div id="answerResult" aria-live="polite"></div><div class="source-ref">${q.source} · 학습용 재구성 문항 / 실제 채점표 아님</div><div class="lesson-next"><button class="btn secondary small" id="prevQuestion" ${quizIndex===0?'disabled':''}>← 이전 문항</button><button class="btn secondary small" id="nextQuestion" ${quizIndex===quizPool.length-1?'disabled':''}>다음 문항 →</button></div></article><aside class="quiz-side"><div class="panel"><h3>키워드 답안 작성법</h3><ul><li><b>01</b>묻는 항목 수를 확인해요.</li><li><b>02</b>교과서 용어를 먼저 써요.</li><li><b>03</b>원인 → 과정 → 결과를 연결해요.</li><li><b>04</b>방향과 숫자를 다시 확인해요.</li></ul><a class="btn secondary small" href="#lesson/${q.topic}">관련 개념 다시 보기 ↗</a></div><div class="notice warm" style="margin-top:15px">문장을 멋지게 쓰는 것보다 정확한 용어와 관계가 먼저예요. 키워드를 모두 넣어도 반대로 설명하면 틀릴 수 있어요.</div>${a?`<div class="notice" style="margin-top:15px">이전에 확인한 문항입니다.<br>${a.mastered?'✓ 직접 점검까지 완료':'↻ 오답 노트에서 복습 중'}</div>`:''}</aside></div>`;}
function collectAnswer(){return $$('[data-answer]').map(x=>x.value.trim()).join('\n\n');}
function persistDraft(){if(activeQuestion){state.drafts[activeQuestion.id]=collectAnswer();save();}}
function resultHtml(q,marks,revealed=false){const found=marks.filter(Boolean).length;return `<div class="result"><div class="result-title">${revealed?'모범답안으로 개념 확인':`핵심어 ${found} / ${marks.length} 확인`}<small>${revealed?'답을 가린 뒤 다시 써 보세요.':'시험 점수가 아닌 포함 여부입니다.'}</small></div><div class="keyword-chips">${q.criteria.map((c,i)=>`<span class="chip ${revealed?'':marks[i]?'ok':'missing'}">${revealed?'':marks[i]?'✓ ':'○ '}${c.label}</span>`).join('')}</div><div class="mini-label">핵심어를 연결한 답안 예시</div><div class="model-answer">${q.answer}</div>${q.warning?`<div class="notice warm">${q.warning}</div>`:''}<div class="self-check"><label><input type="checkbox" id="meaningChecked">방향·수치·인과관계도 모범답안과 비교했어요.</label></div><div class="quiz-actions"><button class="btn small" id="markMastered" disabled>스스로 확인 완료 ✓</button><button class="btn secondary small" id="keepReview">오답 노트에 남기기</button></div><p class="keyboard-hint">정답 표현인데 핵심어가 누락으로 표시되었다면 모범답안과 비교한 뒤 직접 완료 처리할 수 있어요.</p></div>`;}
function doCheck(reveal=false){const q=activeQuestion,ans=collectAnswer();if(!reveal&&!ans.trim()){toast('답안을 먼저 한 줄이라도 써 보세요.');$('#answer0').focus();return;}state.drafts[q.id]=ans;const marks=assess(q,ans);state.answers[q.id]={answer:ans,marks,mastered:false,revealed:reveal,at:Date.now()};save();updateTop();$('#answerResult').innerHTML=resultHtml(q,marks,reveal);bindResult(q);}
function bindResult(q){$('#meaningChecked').onchange=e=>$('#markMastered').disabled=!e.target.checked;$('#markMastered').onclick=()=>{state.answers[q.id]={...state.answers[q.id],mastered:true};save();updateTop();toast('직접 점검까지 완료했어요. 다음 복습에서 기억을 꺼내 보세요.');};$('#keepReview').onclick=()=>{state.answers[q.id]={...state.answers[q.id],mastered:false};save();updateTop();toast('오답 노트에 남겼어요. 모범답안을 가리고 다시 써 보세요.');};}
function review(){const list=reviewItems(),completed=QUESTIONS.filter(q=>state.answers[q.id]?.mastered);return title('RECALL & REVIEW','나의 오답 노트','한 번 본 답을, 다음에는 스스로 떠올릴 수 있도록.',`<button class="btn secondary small" id="exportReview">복습 노트 내려받기 ↓</button>`)+`<div class="summary-bar"><strong>다시 볼 문항 ${list.length}개</strong><span>직접 확인 완료 ${completed.length}개</span></div>${list.length?`<div class="review-grid">${list.map(q=>{const a=state.answers[q.id];const missing=q.criteria.filter((_,i)=>!a.marks?.[i]);return `<article class="panel review-card"><span class="chip">${q.type}</span><h3>${q.title}</h3><p>${a.revealed?'모범답안을 먼저 본 문항 · 스스로 다시 꺼내 쓰기':missing.length?'지난 답에서 확인되지 않은 핵심어':'핵심어는 모두 확인됨 · 의미와 방향 점검 필요'}</p><div class="keyword-chips">${chips((missing.length?missing:q.criteria).map(c=>c.label),missing.length?'missing':'')}</div><a class="btn secondary small" href="#quiz/q/${q.id}">다시 풀기 →</a></article>`;}).join('')}</div>`:`<div class="panel empty"><div class="empty-icon">✳</div><h2>${completed.length?'복습 목록을 모두 점검했어요.':'첫 답안에서 복습이 시작돼요.'}</h2><p>${completed.length?'시간을 조금 두고, 답을 보지 않고 다시 설명해 보세요. 정확한 기억은 다시 꺼내 쓰면서 단단해집니다.':'키워드 훈련에서 답안을 확인하면 여기에 모입니다. 의미까지 직접 점검한 문항은 목록에서 빠져요.'}</p><a class="btn" href="#quiz">키워드 훈련 시작 →</a></div>`}`;}
function sources(){return title('STUDY REFERENCES','자료와 학습 기준','내용의 우선순위와 확인이 필요한 부분을 분명하게 구분했습니다.')+`<div class="source-list"><section class="panel"><h3>01 · 교과서 + 수업 필기가 기본</h3><p>제공한 『2022 개정 고등학교 세포와 물질대사』 PDF 71페이지를 기준으로 단원과 탐구를 구성했습니다. PDF는 두 쪽을 한 화면에 담은 페이지가 많아, 각 개념에 <strong>교과서 인쇄 쪽수와 PDF 페이지를 따로</strong> 표시합니다. 세부 설명과 연습문항은 학습용으로 재구성했습니다.</p><p>작은 손글씨는 모두 정확히 판독했다고 보장할 수 없습니다. 시험 범위가 별도로 안내되었다면 선생님의 범위 공지를 우선하세요. 첫 페이지부터 마지막까지 읽는 대신 어려운 세포호흡·광합성의 흐름부터 시작하도록 순서를 제안했습니다.</p></section><section class="panel"><h3>02 · 작년 기출은 유형의 근거</h3><p>기출 파일에는 인쇄 1/4, 2/4, 4/4 페이지가 있습니다. <strong>3/4 페이지는 누락</strong>되어 확인하지 못했습니다. 소기관 연결·현미경·삼투 그래프·효소 저해·인지질·ATP 계산·발효 유형을 반영했습니다.</p><p>작년 시험 13–14번의 허시·체이스 및 DNA 복제 세부 문제는 현재 제공 교과서의 주요 단원과 다르므로 필수 훈련에는 넣지 않았습니다. 생명과학 역사 문제도 당시 별도 제시된 연표가 없어 실제 답을 확정하지 않았습니다. 새로운 융합문항은 기출 원문이 아닌 제작한 연습문항입니다.</p></section><section class="panel"><h3>03 · 친구 요약본은 보조 자료</h3><p>『생명과학Ⅱ_모범답안포함』의 질문·모범답안과 대조했습니다. 교과서와 차이가 있는 부분은 다음 기준을 적용했습니다.</p><ul><li>ATP 수율: 기본 문제는 교과서 93쪽의 <strong>최대 32 ATP</strong>. 일반적인 30~32 ATP 설명과 구분했습니다.</li><li>효소 연구사: 교과서 77쪽의 <strong>스팔란차니·슈반·섬너·노스럽·필립스</strong>를 우선했습니다.</li><li>용어: 바탕질=기질(matrix), PGAL=G3P. 아세틸 CoA는 아세틸 조효소 A와 같은 뜻입니다.</li><li>야겐도르프: ATP 합성을 유도하는 표준 조건은 pH 4 → 8. 교과서의 반대 조건 질문도 구분했습니다.</li></ul><p>친구의 Claude 링크는 로그인 화면까지만 확인되어 내부 디자인이나 기능을 참고하지 못했습니다.</p></section><section class="panel"><h3>키워드 확인은 어떻게 작동하나요?</h3><p>문항별 핵심어와 일부 동의어를 답안에서 찾아 표시합니다. 공백·대소문자·아래첨자 차이는 정규화합니다. 교사의 실제 채점표를 받은 것은 아니며, 교과서와 기출 유형에서 학습용 기준을 구성했습니다.</p><p><strong>“ATP가 생성되지 않는다”도 ATP가 포함된 답으로 표시될 수 있습니다.</strong> 부정 표현·문맥·방향·계산식의 관계를 완전히 채점하지 못하므로 마지막 자가 점검을 꼭 하세요. 뜻이 맞는데 자동으로 빠졌다고 표시된 경우 직접 확인 완료 처리가 가능합니다.</p></section><section class="panel"><h3>나의 기록 보관</h3><p>답안·진도는 현재 브라우저의 로컬 저장소에만 기록됩니다. 기기 간 자동 동기화는 하지 않습니다. 같은 사이트라도 다른 브라우저에서는 기록이 다를 수 있습니다. 아래 파일로 백업하고 불러올 수 있습니다.</p><div class="export-actions"><button class="btn secondary" id="backupState">학습 기록 백업 ↓</button><label class="btn secondary" for="importState">학습 기록 불러오기 ↑</label><input id="importState" type="file" accept="application/json,.json" hidden><button class="btn secondary" id="printPage">현재 화면 인쇄</button></div><p>학습 시작 시 시험일은 2026년 10월 20일로 설정했습니다. 오늘의 공부 화면에서 변경할 수 있습니다. 집중 타이머는 25분이며 클릭하면 시작·일시정지합니다.</p></section></div>`;}
function emptyPage(msg,link='#home'){return `<div class="empty"><h2>${msg}</h2><a class="btn" href="${link}" style="margin-top:25px">돌아가기</a></div>`;}
function download(name,text,type='text/plain;charset=utf-8'){const blob=new Blob([text],{type}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);}
function exportReview(){const list=reviewItems();let txt='생명노트 · 복습할 핵심어\n키워드 확인은 실제 시험 점수가 아닙니다.\n\n';for(const q of list){const a=state.answers[q.id];txt+=q.title+'\n\n내 답안: '+(a.answer||'(미작성)')+'\n확인할 핵심어: '+q.criteria.filter((_,i)=>!a.marks?.[i]).map(x=>x.label).join(', ')+'\n모범답안: '+q.answer+'\n출처: '+q.source+'\n\n';}if(!list.length)txt+='현재 복습할 문항이 없습니다.\n';download('생명노트-복습.txt',txt);}
function bindCommon(){const exam=$('#examDate');if(exam)exam.onchange=()=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(exam.value))return;state.date=exam.value;save();updateTop();};$$('[data-day]').forEach(b=>b.onclick=()=>{planDay=+b.dataset.day;$('#planContent').innerHTML=planHtml();$$('[data-day]').forEach(x=>x.classList.toggle('active',+x.dataset.day===planDay));bindPlan();});bindPlan();if($('#completeLesson'))$('#completeLesson').onclick=e=>{const id=e.currentTarget.dataset.id;state.lessons[id]=!state.lessons[id];save();e.currentTarget.textContent=state.lessons[id]?'✓ 설명 가능 표시 취소':'스스로 설명했어요 ✓';toast(state.lessons[id]?'설명 가능한 개념으로 표시했어요.':'개념을 다시 복습해 보세요.');};if($('#conceptSearch'))$('#conceptSearch').oninput=e=>{conceptSearch=e.target.value;$('#conceptResults').innerHTML=conceptResults();};if($('#conceptGroup'))$('#conceptGroup').onchange=e=>{conceptGroup=e.target.value;$('#conceptResults').innerHTML=conceptResults();};$$('[data-lab]').forEach(b=>b.onclick=()=>{labStep=0;navigate('#lab/'+b.dataset.lab);});bindLab();bindQuiz();if($('#exportReview'))$('#exportReview').onclick=exportReview;if($('#backupState'))$('#backupState').onclick=()=>download('생명노트-학습기록.json',JSON.stringify({format:'bio-note-v1',state},null,2),'application/json');if($('#printPage'))$('#printPage').onclick=()=>window.print();if($('#importState'))$('#importState').onchange=importState;}
function bindPlan(){$$('[data-plan]').forEach(c=>c.onchange=()=>{state.plan[c.dataset.plan]=c.checked;save();});}
function refreshLab(){$('#labBody').innerHTML=labBody();bindLab();}
function bindLab(){$$('[data-step]').forEach(b=>b.onclick=()=>{labStep=+b.dataset.step;refreshLab();});if($('#calvinCondition'))$('#calvinCondition').onchange=e=>{calvinCondition=e.target.value;$('#calvinResult').innerHTML=calvinResult();};for(const [id,key] of [['energyOn','active'],['blockSynthase','blocked'],['leakMembrane','leak']])if($('#'+id))$('#'+id).onchange=e=>{grad[key]=e.target.checked;$('#gradientResult').innerHTML=gradientResult();};if($('#enzymeMode'))$('#enzymeMode').onchange=e=>{enzymeMode=e.target.value;$('#enzymeResult').innerHTML=enzymeResult();};if($('#substrate'))$('#substrate').oninput=e=>{substrate=+e.target.value;$('#subValue').textContent=substrate;$('#enzymeResult').innerHTML=enzymeResult();};if($('#cellVolume'))$('#cellVolume').oninput=e=>{cellVolume=+e.target.value;$('#volumeValue').textContent=cellVolume;$('#osmosisResult').innerHTML=osmosisResult();};}
function bindQuiz(){$$('[data-qtype]').forEach(b=>b.onclick=()=>{persistDraft();quizIndex=0;navigate('#quiz/'+encodeURIComponent(b.dataset.qtype));});if($('#quizTopic'))$('#quizTopic').onchange=e=>{persistDraft();quizIndex=0;navigate(e.target.value==='전체'?'#quiz':'#quiz/topic/'+e.target.value);};if($('#questionPicker'))$('#questionPicker').onchange=e=>{persistDraft();quizIndex=+e.target.value;activeQuestion=quizPool[quizIndex];state.lastQuestion=activeQuestion?.id;save();$('#quizArea').innerHTML=questionHtml();bindQuestion();};bindQuestion();}
function bindQuestion(){$$('[data-answer]').forEach(x=>x.oninput=persistDraft);if($('#checkAnswer'))$('#checkAnswer').onclick=()=>doCheck();if($('#showAnswer'))$('#showAnswer').onclick=()=>doCheck(true);if($('#clearAnswer'))$('#clearAnswer').onclick=()=>{$$('[data-answer]').forEach(x=>x.value='');state.drafts[activeQuestion.id]='';save();$('#answerResult').innerHTML='';$('#answer0').focus();};for(const [id,dir]of[['prevQuestion',-1],['nextQuestion',1]])if($('#'+id))$('#'+id).onclick=()=>{persistDraft();quizIndex+=dir;activeQuestion=quizPool[quizIndex];state.lastQuestion=activeQuestion.id;save();$('#questionPicker').value=String(quizIndex);$('#quizArea').innerHTML=questionHtml();bindQuestion();$('#quizArea').scrollIntoView({behavior:'smooth',block:'start'});};}
function importState(e){const f=e.target.files[0];if(!f)return;if(f.size>2000000){toast('학습 기록 파일 크기가 너무 큽니다.');return;}const reader=new FileReader();reader.onload=()=>{try{const d=JSON.parse(reader.result);if(d.format!=='bio-note-v1'||!d.state||typeof d.state!=='object')throw Error();const s=d.state;const clean={date:/^\d{4}-\d{2}-\d{2}$/.test(s.date)?s.date:state.date,lessons:{},plan:{},answers:{},drafts:{},lastQuestion:'k1'};for(const l of LESSONS)if(s.lessons?.[l.id])clean.lessons[l.id]=true;for(const p of PLAN.flatMap(x=>x.items))if(s.plan?.[p[0]])clean.plan[p[0]]=true;for(const q of QUESTIONS){if(typeof s.drafts?.[q.id]==='string')clean.drafts[q.id]=s.drafts[q.id].slice(0,30000);const a=s.answers?.[q.id];if(a&&typeof a.answer==='string')clean.answers[q.id]={answer:a.answer.slice(0,30000),marks:assess(q,a.answer),mastered:a.mastered===true,revealed:a.revealed===true,at:Number(a.at)||Date.now()};}state=clean;save();updateTop();toast('학습 기록을 불러왔어요.');}catch(err){toast('생명노트에서 내려받은 올바른 기록 파일을 선택해 주세요.');}};reader.readAsText(f);}
let remaining=25*60,timerRunning=false,timerEnd=0;function paintTimer(){$('#timerText').textContent=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0')+(timerRunning?' 진행 중':' 집중');$('#focusBtn').setAttribute('aria-label',timerRunning?'집중 타이머 일시정지':'집중 타이머 시작');}
$('#focusBtn').onclick=()=>{if(timerRunning){remaining=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));timerRunning=false;}else{if(remaining<=0)remaining=1500;timerEnd=Date.now()+remaining*1000;timerRunning=true;}paintTimer();};setInterval(()=>{if(!timerRunning)return;remaining=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));if(!remaining){timerRunning=false;toast('25분 집중 완료! 잠깐 쉬고, 방금 배운 내용을 한 문장으로 떠올려 보세요.');}paintTimer();},500);
function render(){let parts;try{parts=decodeURIComponent(location.hash.slice(1)||'home').split('/');}catch(e){parts=['home'];}const page=parts[0];let html;if(page==='home'||page==='main')html=home();else if(page==='concepts')html=concepts();else if(page==='lesson')html=lesson(parts[1]);else if(page==='lab')html=lab(parts[1]);else if(page==='quiz'){if(parts[1]==='q')html=quiz('전체','전체',parts[2]);else if(parts[1]==='topic')html=quiz('전체',parts[2]);else html=quiz(parts[1]||'전체');}else if(page==='review')html=review();else if(page==='sources')html=sources();else html=emptyPage('페이지를 찾을 수 없어요.');$('#main').innerHTML=html;$$('[data-nav]').forEach(a=>a.classList.toggle('active',a.dataset.nav===(page==='lesson'?'concepts':page)));const labels={home:'오늘의 공부',concepts:'교과서 개념 지도',lesson:'개념 이해',lab:'과정 실험실',quiz:'키워드 훈련',review:'나의 오답 노트',sources:'자료와 학습 기준'};$('#breadcrumb').textContent='나의 학습실 / '+(labels[page]||'오늘의 공부');document.title=(labels[page]||'학습실')+' · 생명노트';updateTop();bindCommon();window.scrollTo(0,0);}
window.addEventListener('hashchange',render);render();paintTimer();
</script>
</body></html>
